<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sureshot PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2328" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --chrome: #EEF1F3;
    --chrome-2: #E0E5E9;
    --sheet: #FFFFFF;
    --stage: #D9DEE2;
    --ink: #1C2530;
    --ink-soft: #5B6772;
    --line: #C9D1D8;
    --sight: #C8102E;
    --button-bg: #C8102E;
    --button-ink: #FFFFFF;
    --focus: #1B5FD6;
    --star: #B87800;
    --bar-h: env(titlebar-area-height, 40px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome: #1E2328;
      --chrome-2: #2B3138;
      --sheet: #343B43;
      --stage: #15191D;
      --ink: #E8ECEF;
      --ink-soft: #A3AEB8;
      --line: #4A545E;
      --sight: #FF6B7A;
      --button-bg: #D92A40;
      --button-ink: #FFFFFF;
      --focus: #8AB0FF;
      --star: #F2B53A;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--chrome);
    color: var(--ink);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Tab strip (sits in the title bar when installed) ---------- */
  .bar {
    position: fixed;
    top: env(titlebar-area-y, 0px);
    left: env(titlebar-area-x, 0px);
    width: env(titlebar-area-width, 100%);
    height: var(--bar-h);
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 0 6px;
    -webkit-app-region: drag;
    app-region: drag;
  }
  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 100%;
    min-width: 0;
    flex: 0 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 1 auto;
    width: 200px;
    min-width: 96px;
    height: calc(var(--bar-h) - 6px);
    padding: 0 4px 0 12px;
    border-radius: 8px 8px 0 0;
    color: var(--ink-soft);
    user-select: none;
  }
  .tab:hover { background: var(--chrome-2); }
  .tab.active { background: var(--sheet); color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .tab.home { flex: none; width: 44px; min-width: 44px; padding: 0; justify-content: center; }

  /* Sight mark: hollow on background tabs, a centred dot on the tab you're looking at. */
  .mark {
    flex: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.45;
  }
  .tab.active .mark, .mark.on {
    border-color: var(--sight);
    background: radial-gradient(circle, var(--sight) 0 1.8px, transparent 2.4px);
    opacity: 1;
  }
  .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .close {
    flex: none;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    display: grid;
    place-items: center;
    opacity: 0.7;
  }
  .close:hover { background: var(--chrome-2); opacity: 1; }
  .tab.active .close:hover { background: var(--chrome); }
  .add {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    flex: none;
    width: 30px;
    height: 30px;
    margin-bottom: 3px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    display: grid;
    place-items: center;
  }
  .add:hover { background: var(--chrome-2); }
  .edge-btn {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    margin: 0 4px 5px auto;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--sheet);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .edge-btn:hover { background: var(--chrome-2); }

  main {
    position: fixed;
    top: var(--bar-h);
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--stage);
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    visibility: hidden;
    background: var(--stage);
  }
  .frame.active { visibility: visible; }

  /* ---------- Home: sidebar + grid ---------- */
  .home-view {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 224px minmax(0, 1fr);
    background: var(--sheet);
  }
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 10px 16px;
    background: var(--chrome);
    border-right: 1px solid var(--line);
  }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-sep { height: 1px; margin: 10px 8px; background: var(--line); }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 34px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    text-align: left;
    white-space: nowrap;
  }
  .nav-item:hover { background: var(--chrome-2); color: var(--ink); }
  .nav-item[aria-current="true"] { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--sight); }
  .nav-icon { flex: none; width: 16px; height: 16px; display: grid; place-items: center; }
  .nav-icon svg .fill { fill: none; }
  .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 400; }
  .side-foot { margin-top: auto; padding: 20px 8px 0; font-size: 12px; color: var(--ink-soft); }
  .side-foot p { margin: 0 0 10px; }
  .link-btn { border: 0; padding: 0; background: none; color: var(--ink-soft); text-decoration: underline; font-size: 12px; }
  .link-btn:hover { color: var(--ink); }

  .content { min-width: 0; min-height: 0; overflow-y: auto; padding: 28px 32px 48px; }
  .content-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
  .content-head .titles { flex: 1 1 auto; min-width: 0; }
  .content-head h1 {
    margin: 0;
    font: 600 26px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.01em;
  }
  .content-head p { margin: 2px 0 0; color: var(--ink-soft); }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .primary, .secondary {
    min-height: 34px;
    padding: 6px 16px;
    border-radius: 6px;
    font-weight: 600;
  }
  .primary { border: 0; background: var(--button-bg); color: var(--button-ink); }
  .primary:hover { filter: brightness(1.08); }
  .secondary { border: 1px solid var(--line); background: transparent; }
  .secondary:hover { background: var(--chrome); }

  .search { position: relative; margin-bottom: 20px; max-width: 420px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .search input {
    width: 100%;
    height: 34px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--chrome);
  }
  .search input::placeholder { color: var(--ink-soft); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 14px; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--sheet);
    overflow: hidden;
  }
  .card:hover { border-color: var(--ink-soft); }
  .card.is-pinned { border-color: var(--ink-soft); }
  .card-open {
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: left;
  }
  .card-open:focus-visible { outline-offset: -2px; }
  .card-art {
    position: relative;
    height: 104px;
    display: grid;
    place-items: center;
    background: var(--chrome);
    color: var(--ink-soft);
  }
  .card-badge {
    position: absolute;
    left: 8px;
    top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px 2px 6px;
    border-radius: 999px;
    background: var(--sheet);
    color: var(--sight);
    font-size: 11px;
    font-weight: 600;
  }
  .card-body { padding: 10px 12px 2px; }
  .card-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }
  .card-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 3px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .card-actions { display: flex; justify-content: flex-end; gap: 2px; padding: 2px 6px 6px; }
  .act {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    display: grid;
    place-items: center;
  }
  .act:hover { background: var(--chrome); color: var(--ink); }
  .act[aria-pressed="true"] { color: var(--ink); }
  .act.fav[aria-pressed="true"] { color: var(--star); }
  .act svg .fill { fill: none; }
  .act[aria-pressed="true"] svg .fill { fill: currentColor; }

  .view-empty { padding: 48px 8px; color: var(--ink-soft); max-width: 52ch; }
  .view-empty h2 { margin: 0 0 6px; color: var(--ink); font: 600 17px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .view-empty p { margin: 0; }

  .first-run { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px 24px; text-align: center; }
  .first-run p { margin: 0; color: var(--ink-soft); max-width: 46ch; }
  .first-run h2 { margin: 0; font: 600 20px/1.25 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .reticle { width: 104px; height: 104px; color: color-mix(in srgb, var(--ink-soft) 55%, transparent); margin-bottom: 6px; }
  .reticle .dot { fill: var(--sight); }

  @media (max-width: 720px) {
    .home-view { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .side { flex-direction: row; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
    .nav { flex-direction: row; }
    .nav-sep { width: 1px; height: auto; margin: 6px 4px; }
    .nav-item { width: auto; }
    .side-foot { display: none; }
    .content { padding: 20px 16px 40px; }
  }

  /* ---------- Drag and drop ---------- */
  .drop {
    position: absolute;
    inset: 10px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 2px dashed var(--sight);
    border-radius: 14px;
    background: color-mix(in srgb, var(--sheet) 90%, transparent);
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
  }
  .drop .reticle { color: var(--sight); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 10;
    max-width: min(520px, calc(100% - 32px));
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--sheet);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .toast-btn { flex: none; border: 0; padding: 4px 8px; border-radius: 4px; background: transparent; color: inherit; font-weight: 600; text-decoration: underline; }
  .toast-btn:hover { background: color-mix(in srgb, var(--sheet) 15%, transparent); }
</style>
</head>
<body>
  <header class="bar">
    <div class="tab home" id="tab-home" role="tab" aria-controls="home" aria-label="Home" title="Home" tabindex="0">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.6V9.8H6.4v3.7H3a.5.5 0 0 1-.5-.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Open PDFs" aria-owns="tab-home"></div>
    <button class="add" id="addBtn" type="button" title="Open PDFs (Ctrl+O)" aria-label="Open PDFs">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="edge-btn" id="edgeBtn" type="button" hidden title="Open this PDF in an Edge browser tab, where Ask Copilot is available">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8 2h4v4M12 2 6.5 7.5M10.5 8.5V11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1h2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Open in Edge
    </button>
  </header>

  <main id="stage">
    <section class="home-view" id="home" role="tabpanel" aria-labelledby="tab-home">
      <aside class="side">
        <nav class="nav" id="nav" aria-label="Recent PDFs"></nav>
        <div class="side-foot">
          <p id="hint"></p>
          <button class="link-btn" id="clearBtn" type="button" hidden>Clear the Recent list</button>
        </div>
      </aside>

      <div class="content">
        <div class="content-head">
          <div class="titles">
            <h1 id="viewTitle">All recent</h1>
            <p id="viewCount"></p>
          </div>
          <div class="head-actions">
            <button class="secondary" id="restoreBtn" type="button" hidden>Reopen last session</button>
            <button class="primary" id="chooseBtn" type="button">Choose PDFs</button>
          </div>
        </div>

        <div class="search" id="searchWrap" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m9.5 9.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <label class="sr-only" for="search">Search all recent PDFs</label>
          <input id="search" type="search" placeholder="Search all recent PDFs" autocomplete="off">
        </div>

        <div class="grid" id="grid"></div>
        <div class="view-empty" id="viewEmpty" hidden><h2></h2><p></p></div>

        <div class="first-run" id="firstRun" hidden>
          <svg class="reticle" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="42" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="60" cy="60" r="22" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M60 4v26M60 90v26M4 60h26M90 60h26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle class="dot" cx="60" cy="60" r="5"/>
          </svg>
          <h2>No recent PDFs yet</h2>
          <p>PDFs you open will appear here, so you can get back to any of them with one click. You can also drop PDF files anywhere in this window.</p>
        </div>
      </div>
    </section>

    <div class="drop" id="drop" hidden>
      <svg class="reticle" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="42" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M60 4v26M60 90v26M4 60h26M90 60h26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle class="dot" cx="60" cy="60" r="5"/>
      </svg>
      Drop to open
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button class="toast-btn" id="toastBtn" type="button" hidden></button></div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>

<script>
(() => {
  'use strict';

  const APP = 'Sureshot PDF';
  const HOME = 'home';
  const MAX_RECENTS = 40;
  const DAY = 86400000;

  const $ = (sel) => document.querySelector(sel);
  const tabsEl = $('#tabs');
  const homeTab = $('#tab-home');
  const homeEl = $('#home');
  const stage = $('#stage');
  const dropEl = $('#drop');
  const toastEl = $('#toast');
  const restoreBtn = $('#restoreBtn');
  const clearBtn = $('#clearBtn');
  const fileInput = $('#fileInput');
  const edgeBtn = $('#edgeBtn');
  const searchEl = $('#search');

  const CLOSE_ICON = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  // Open tabs: {id, name, key, url, handle, recentId, tabEl, frame}
  const tabs = [];
  let activeId = HOME;
  let nextId = 1;

  // Recent files, newest first: {id, name, size, lastOpened, handle}
  let recents = [];
  let savedSession = [];

  const isPdf = (file) => !!file && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''));
  const keyOf = (file) => file.name + '|' + file.size + '|' + file.lastModified;
  const findTab = (id) => tabs.find((t) => t.id === id);

  // ---------- Tabs ----------

  // Opens a file in a new tab (or switches to it if it's already open). Returns the tab.
  function openFile(file, handle) {
    if (!file) return null;
    if (!isPdf(file)) {
      toast('Skipped ' + file.name + '. Sureshot PDF opens PDF files only.');
      return null;
    }
    const key = keyOf(file);
    const existing = tabs.find((t) => t.key === key);
    if (existing) {
      if (handle && !existing.handle) existing.handle = handle;
      activate(existing.id);
      return existing;
    }

    const id = nextId++;
    const blob = new Blob([file], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.id = 'tab-' + id;
    tabEl.title = file.name;
    tabEl.tabIndex = -1;
    tabEl.setAttribute('role', 'tab');
    tabEl.setAttribute('aria-controls', 'frame-' + id);

    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.setAttribute('aria-hidden', 'true');

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = file.name.replace(/\.pdf$/i, '');

    const close = document.createElement('button');
    close.className = 'close';
    close.type = 'button';
    close.tabIndex = -1;
    close.title = 'Close';
    close.setAttribute('aria-label', 'Close ' + file.name);
    close.innerHTML = CLOSE_ICON;

    tabEl.append(mark, title, close);
    tabEl.addEventListener('click', (e) => { if (!e.target.closest('.close')) activate(id); });
    tabEl.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    tabEl.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); closeTab(id); } });
    tabEl.addEventListener('keydown', onTabKey);
    close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });

    const frame = document.createElement('iframe');
    frame.className = 'frame';
    frame.id = 'frame-' + id;
    frame.title = file.name;
    frame.setAttribute('role', 'tabpanel');
    frame.setAttribute('aria-labelledby', 'tab-' + id);
    frame.src = url;

    stage.insertBefore(frame, dropEl);
    tabsEl.appendChild(tabEl);
    const tab = { id, name: file.name, key, url, blob, edgeUrl: null, handle: handle || null, recentId: null, tabEl, frame };
    tabs.push(tab);
    activate(id);
    saveSession();
    return tab;
  }

  function activate(id) {
    activeId = id;
    const onHome = id === HOME;
    homeTab.classList.toggle('active', onHome);
    homeTab.setAttribute('aria-selected', String(onHome));
    homeTab.tabIndex = onHome ? 0 : -1;
    homeEl.hidden = !onHome;

    for (const t of tabs) {
      const on = t.id === id;
      t.tabEl.classList.toggle('active', on);
      t.tabEl.setAttribute('aria-selected', String(on));
      t.tabEl.tabIndex = on ? 0 : -1;
      t.frame.classList.toggle('active', on);
    }
    const t = findTab(id);
    document.title = t ? t.name + ' — ' + APP : APP;
    edgeBtn.hidden = !t;
    edgeBtn.setAttribute('aria-label', t ? 'Open ' + t.name + ' in Edge' : 'Open in Edge');
    if (t) t.tabEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (onHome) renderHome();
  }

  function closeTab(id) {
    const index = tabs.findIndex((t) => t.id === id);
    if (index < 0) return;
    const [t] = tabs.splice(index, 1);
    const hadFocus = t.tabEl.contains(document.activeElement);
    t.tabEl.remove();
    t.frame.remove();
    setTimeout(() => URL.revokeObjectURL(t.url), 1000);

    if (activeId === id) {
      const next = tabs[Math.min(index, tabs.length - 1)];
      activate(next ? next.id : HOME);
      if (hadFocus) (next ? next.tabEl : homeTab).focus();
    } else if (activeId === HOME) {
      renderHome();
    }
    saveSession();
  }

  function onTabKey(e) {
    const order = [homeTab].concat(tabs.map((t) => t.tabEl));
    const i = order.indexOf(e.currentTarget);
    if (i < 0) return;
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % order.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + order.length) % order.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = order.length - 1;
    else if (e.key === 'Delete' && i > 0) { e.preventDefault(); closeTab(tabs[i - 1].id); return; }
    else if ((e.key === 'Enter' || e.key === ' ') && i === 0) { e.preventDefault(); activate(HOME); return; }
    if (j !== null) {
      e.preventDefault();
      activate(j === 0 ? HOME : tabs[j - 1].id);
      order[j].focus();
    }
  }

  homeTab.addEventListener('click', () => activate(HOME));
  homeTab.addEventListener('keydown', onTabKey);

  // ---------- Open in Edge (for Ask Copilot) ----------

  // Opens the current PDF in a normal Edge browser tab. That tab gets its own copy of the file,
  // which stays available after you close the PDF in Sureshot, until Sureshot itself is closed.
  function openActiveInEdge() {
    const t = findTab(activeId);
    if (!t) return;
    if (!t.edgeUrl) t.edgeUrl = URL.createObjectURL(t.blob);
    const win = window.open(t.edgeUrl, '_blank');
    if (!win) toast('Edge blocked the new tab. Allow pop-ups for Sureshot PDF, then try again.');
  }
  edgeBtn.addEventListener('click', openActiveInEdge);

  // ---------- Opening files ----------

  // Opens a file and, when we have a handle to it, records it in Recent.
  async function openAndRemember(file, handle) {
    const tab = openFile(file, handle);
    if (tab && handle) {
      try { tab.recentId = await rememberRecent(handle, file); } catch (err) { /* Recent is a convenience */ }
      if (activeId === HOME) renderHome();
    }
    return tab;
  }

  async function openHandle(handle) {
    let file;
    try {
      file = await handle.getFile();
    } catch (err) {
      toast('Couldn’t open ' + handle.name + '. ' + err.message);
      return;
    }
    await openAndRemember(file, handle);
  }

  async function pickFiles() {
    if ('showOpenFilePicker' in window) {
      let handles;
      try {
        handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: 'PDF files', accept: { 'application/pdf': ['.pdf'] } }]
        });
      } catch (err) {
        if (err.name !== 'AbortError') toast('Couldn’t show the file picker. ' + err.message);
        return;
      }
      for (const h of handles) await openHandle(h);
    } else {
      fileInput.value = '';
      fileInput.click();
    }
  }

  fileInput.addEventListener('change', () => {
    for (const f of fileInput.files) openFile(f, null);
  });
  $('#addBtn').addEventListener('click', pickFiles);
  $('#chooseBtn').addEventListener('click', pickFiles);

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      pickFiles();
    }
  });

  // PDFs opened from File Explorer ("Open with > Sureshot PDF")
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async (params) => {
      if (!params.files || !params.files.length) return;
      for (const h of params.files) {
        if (h.kind === 'file') await openHandle(h);
      }
    });
  }

  // ---------- Drag and drop ----------

  let dragDepth = 0;
  const hasFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    dropEl.hidden = false;
  });
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropEl.hidden = true;
  });
  window.addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropEl.hidden = true;

    // Everything has to be read from the drop event before the first await.
    const entries = Array.from(e.dataTransfer.items)
      .filter((item) => item.kind === 'file')
      .map((item) => ({
        file: item.getAsFile(),
        handle: item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null)
      }));

    for (const entry of entries) {
      const handle = await entry.handle;
      await openAndRemember(entry.file, handle && handle.kind === 'file' ? handle : null);
    }
  });

  // ---------- Storage (kept in this app, on this PC) ----------

  function idb(mode, op) {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { resolve(undefined); return; }
      const open = indexedDB.open('sureshot-pdf', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('session');
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const db = open.result;
        const tx = db.transaction('session', mode);
        const request = op(tx.objectStore('session'));
        tx.oncomplete = () => { db.close(); resolve(request.result); };
        tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
      };
    });
  }
  const load = (key) => idb('readonly', (store) => store.get(key));
  const store = (key, value) => idb('readwrite', (s) => s.put(value, key)).catch(() => {});

  let saveTimer = null;
  function saveSession() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      store('handles', tabs.filter((t) => t.handle).map((t) => t.handle));
    }, 300);
  }

  // ---------- Recent ----------

  // Pinned and favourite files are never dropped; the rest are capped at MAX_RECENTS.
  function trimRecents() {
    let others = 0;
    recents = recents.filter((r) => {
      if (r.pinned || r.favourite) return true;
      others++;
      return others <= MAX_RECENTS;
    });
  }

  async function rememberRecent(handle, file) {
    await ready;
    let entry = null;
    for (const r of recents) {
      try {
        if (await r.handle.isSameEntry(handle)) { entry = r; break; }
      } catch (err) { /* stale handle; ignore */ }
    }
    if (!entry) entry = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), pinned: false, favourite: false };
    entry.handle = handle;
    entry.name = file.name;
    entry.size = file.size;
    entry.lastOpened = Date.now();
    recents = [entry].concat(recents.filter((r) => r !== entry));
    trimRecents();
    store('recents', recents);
    return entry.id;
  }

  function removeRecent(id, offerUndo) {
    const index = recents.findIndex((r) => r.id === id);
    if (index < 0) return;
    const [entry] = recents.splice(index, 1);
    store('recents', recents);
    renderHome();
    if (offerUndo) {
      toast('Removed ' + entry.name + ' from the list. The file itself wasn’t deleted.', 'Undo', () => {
        recents.splice(Math.min(index, recents.length), 0, entry);
        store('recents', recents);
        renderHome();
      });
    }
  }

  function toggleFlag(id, flag) {
    const entry = recents.find((r) => r.id === id);
    if (!entry) return;
    entry[flag] = !entry[flag];
    if (flag === 'pinned') entry.pinnedAt = entry.pinned ? Date.now() : undefined;
    trimRecents();
    store('recents', recents);
    renderHome();
    const btn = document.querySelector('.act.' + (flag === 'pinned' ? 'pin' : 'fav') + '[data-id="' + id + '"]');
    if (btn) btn.focus();
  }

  async function openRecent(id) {
    const entry = recents.find((r) => r.id === id);
    if (!entry) return;

    const alreadyOpen = tabs.find((t) => t.recentId === id);
    if (alreadyOpen) {
      entry.lastOpened = Date.now();
      recents = [entry].concat(recents.filter((r) => r !== entry));
      store('recents', recents);
      activate(alreadyOpen.id);
      return;
    }

    try {
      let permission = await entry.handle.queryPermission({ mode: 'read' });
      if (permission !== 'granted') permission = await entry.handle.requestPermission({ mode: 'read' });
      if (permission !== 'granted') {
        toast('Sureshot PDF needs your permission to read ' + entry.name + '. Click it again and choose Allow.');
        return;
      }
      const file = await entry.handle.getFile();
      await openAndRemember(file, entry.handle);
    } catch (err) {
      if (err && err.name === 'NotFoundError') {
        removeRecent(id, false);
        toast(entry.name + ' was moved, renamed or deleted, so it’s been removed from the list.');
      } else {
        toast('Couldn’t open ' + entry.name + '. ' + (err && err.message ? err.message : ''));
      }
    }
  }

  // ---------- Date buckets ----------

  function startOfDay(time) {
    const d = new Date(time);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function bucketOf(time) {
    const today = startOfDay(Date.now());
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // Monday
    const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(weekStart.getDate() - 7);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    if (time >= today.getTime()) return 'today';
    if (time >= yesterday.getTime()) return 'yesterday';
    if (time >= weekStart.getTime()) return 'thisweek';
    if (time >= lastWeekStart.getTime()) return 'lastweek';
    if (time >= monthStart.getTime()) return 'thismonth';
    return 'older';
  }
  function whenText(time) {
    const date = new Date(time);
    const clock = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const bucket = bucketOf(time);
    if (bucket === 'today') return 'Today, ' + clock;
    if (bucket === 'yesterday') return 'Yesterday, ' + clock;
    const days = Math.round((startOfDay(Date.now()) - startOfDay(time)) / DAY);
    if (days < 7) return date.toLocaleDateString([], { weekday: 'long' }) + ', ' + clock;
    const sameYear = date.getFullYear() === new Date().getFullYear();
    return date.toLocaleDateString([], sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function sizeText(bytes) {
    if (typeof bytes !== 'number') return '';
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ---------- Home rendering ----------

  const ICONS = {
    pin: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M9.8 1.8 14.2 6.2 12.4 6.9 10.1 9.2 10.4 12.3 9.6 13.1 6.9 10.4 6.9 10.4 2.9 14.4 1.6 14.4 1.6 13.1 5.6 9.1 2.9 6.4 3.7 5.6 6.8 5.9 9.1 3.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    star: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="m8 1.7 1.9 4 4.3.5-3.2 3 .9 4.3L8 11.3l-3.9 2.2.9-4.3-3.2-3 4.3-.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    remove: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    all: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.6V8l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    day: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    bigDoc: '<svg width="42" height="52" viewBox="0 0 42 52" aria-hidden="true"><path d="M5 2h22l11 11v35a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="var(--sheet)" stroke="currentColor" stroke-width="1.6"/><path d="M27 2v11h11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 24h20M10 30h20M10 36h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></svg>'
  };

  const VIEWS = [
    { id: 'pinned', label: 'Pinned', icon: 'pin', always: true, test: (r) => r.pinned,
      empty: ['Nothing pinned yet', 'Pin a PDF to keep it at the top of every list. Pinned PDFs are never dropped from Recent.'] },
    { id: 'favourites', label: 'Favourites', icon: 'star', always: true, test: (r) => r.favourite,
      empty: ['No favourites yet', 'Star a PDF to collect it here. Favourites are never dropped from Recent.'] },
    { sep: true },
    { id: 'all', label: 'All recent', icon: 'all', always: true, test: () => true,
      empty: ['No recent PDFs', 'PDFs you open will appear here.'] },
    { id: 'today', label: 'Today', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'today' },
    { id: 'yesterday', label: 'Yesterday', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'yesterday' },
    { id: 'thisweek', label: 'This week', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'thisweek' },
    { id: 'lastweek', label: 'Last week', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'lastweek' },
    { id: 'thismonth', label: 'This month', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'thismonth' },
    { id: 'older', label: 'Older', icon: 'day', test: (r) => bucketOf(r.lastOpened) === 'older' }
  ];
  const viewById = (id) => VIEWS.find((v) => v.id === id);

  let currentView = 'all';
  try { const saved = localStorage.getItem('sureshot.view'); if (saved && viewById(saved)) currentView = saved; } catch (err) { /* ignore */ }

  function setView(id) {
    currentView = id;
    try { localStorage.setItem('sureshot.view', id); } catch (err) { /* ignore */ }
    if (searchEl.value) searchEl.value = '';
    renderHome();
  }

  // Pinned first, then most recently opened.
  const byPinThenRecent = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.lastOpened - a.lastOpened;

  function renderNav() {
    const nav = $('#nav');
    nav.replaceChildren();
    for (const v of VIEWS) {
      if (v.sep) {
        const sep = document.createElement('div');
        sep.className = 'nav-sep';
        sep.setAttribute('role', 'separator');
        nav.appendChild(sep);
        continue;
      }
      const count = recents.filter(v.test).length;
      if (!v.always && count === 0 && currentView !== v.id) continue;

      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'nav-item';
      item.dataset.view = v.id;
      if (v.id === currentView && !searchEl.value.trim()) item.setAttribute('aria-current', 'true');

      const icon = document.createElement('span');
      icon.className = 'nav-icon';
      icon.innerHTML = ICONS[v.icon];
      const label = document.createElement('span');
      label.className = 'nav-label';
      label.textContent = v.label;
      const num = document.createElement('span');
      num.className = 'nav-count';
      num.textContent = count ? String(count) : '';
      item.append(icon, label, num);
      nav.appendChild(item);
    }
  }

  function makeCard(r, openIds) {
    const card = document.createElement('article');
    card.className = 'card' + (r.pinned ? ' is-pinned' : '');

    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'card-open';
    open.dataset.id = r.id;
    open.title = 'Open ' + r.name;

    const art = document.createElement('span');
    art.className = 'card-art';
    art.innerHTML = ICONS.bigDoc;
    if (openIds.has(r.id)) {
      const badge = document.createElement('span');
      badge.className = 'card-badge';
      const mark = document.createElement('span');
      mark.className = 'mark on';
      mark.setAttribute('aria-hidden', 'true');
      badge.append(mark, document.createTextNode('In a tab'));
      art.appendChild(badge);
    }

    const body = document.createElement('span');
    body.className = 'card-body';
    const name = document.createElement('span');
    name.className = 'card-name';
    name.textContent = r.name.replace(/\.pdf$/i, '');
    const meta = document.createElement('span');
    meta.className = 'card-meta';
    const when = document.createElement('span');
    when.textContent = whenText(r.lastOpened);
    const size = document.createElement('span');
    size.textContent = sizeText(r.size);
    meta.append(when, size);
    body.append(name, meta);
    open.append(art, body);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const mk = (cls, icon, pressed, onLabel, offLabel) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'act ' + cls;
      b.dataset.id = r.id;
      if (pressed !== null) b.setAttribute('aria-pressed', String(pressed));
      const text = pressed ? onLabel : offLabel;
      b.title = text;
      b.setAttribute('aria-label', text + ': ' + r.name);
      b.innerHTML = ICONS[icon];
      return b;
    };
    actions.append(
      mk('pin', 'pin', !!r.pinned, 'Unpin', 'Pin'),
      mk('fav', 'star', !!r.favourite, 'Remove from favourites', 'Add to favourites'),
      mk('remove', 'remove', null, '', 'Remove from list')
    );
    card.append(open, actions);
    return card;
  }

  function renderHome() {
    const hasRecents = recents.length > 0;
    const query = searchEl.value.trim();
    renderNav();

    $('#firstRun').hidden = hasRecents;
    $('#searchWrap').hidden = !hasRecents;
    clearBtn.hidden = !hasRecents;

    const n = savedSession.length;
    restoreBtn.hidden = n === 0 || tabs.length > 0;
    restoreBtn.textContent = n === 1 ? 'Reopen last session’s PDF' : 'Reopen last session’s ' + n + ' PDFs';

    const view = viewById(currentView) || viewById('all');
    let items;
    if (query) {
      const q = query.toLowerCase();
      items = recents.filter((r) => r.name.toLowerCase().includes(q));
      $('#viewTitle').textContent = 'Search results';
    } else {
      items = recents.filter(view.test);
      $('#viewTitle').textContent = view.label;
    }
    items.sort(byPinThenRecent);
    $('#viewCount').textContent = hasRecents ? (items.length === 1 ? '1 PDF' : items.length + ' PDFs') : '';

    const grid = $('#grid');
    grid.replaceChildren();
    const openIds = new Set(tabs.map((t) => t.recentId).filter(Boolean));
    for (const r of items) grid.appendChild(makeCard(r, openIds));

    const emptyBox = $('#viewEmpty');
    emptyBox.hidden = !hasRecents || items.length > 0;
    if (!emptyBox.hidden) {
      const [title, text] = query
        ? ['No matches', 'No recent PDFs have “' + query + '” in their name.']
        : (view.empty || ['Nothing here', 'No PDFs were opened in this period.']);
      emptyBox.querySelector('h2').textContent = title;
      emptyBox.querySelector('p').textContent = text;
    }
  }

  $('#nav').addEventListener('click', (e) => {
    const item = e.target.closest('.nav-item');
    if (item) setView(item.dataset.view);
  });

  $('#grid').addEventListener('click', (e) => {
    const act = e.target.closest('.act');
    if (act) {
      const id = act.dataset.id;
      if (act.classList.contains('pin')) toggleFlag(id, 'pinned');
      else if (act.classList.contains('fav')) toggleFlag(id, 'favourite');
      else if (act.classList.contains('remove')) removeRecent(id, true);
      return;
    }
    const open = e.target.closest('.card-open');
    if (open) openRecent(open.dataset.id);
  });
  $('#grid').addEventListener('auxclick', (e) => {
    const open = e.target.closest('.card-open');
    if (open && e.button === 1) { e.preventDefault(); openRecent(open.dataset.id); }
  });

  searchEl.addEventListener('input', renderHome);
  searchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchEl.value) { searchEl.value = ''; renderHome(); }
  });

  clearBtn.addEventListener('click', () => {
    const keep = recents.filter((r) => r.pinned || r.favourite).length;
    const message = keep
      ? 'Clear the Recent list? Your ' + keep + ' pinned and favourite PDFs will stay. No files will be deleted.'
      : 'Clear the Recent list? No files will be deleted.';
    if (!window.confirm(message)) return;
    recents = recents.filter((r) => r.pinned || r.favourite);
    store('recents', recents);
    searchEl.value = '';
    renderHome();
  });

  restoreBtn.addEventListener('click', async () => {
    const list = savedSession;
    savedSession = [];
    renderHome();
    let failed = 0;
    for (const handle of list) {
      try {
        let permission = await handle.queryPermission({ mode: 'read' });
        if (permission !== 'granted') permission = await handle.requestPermission({ mode: 'read' });
        if (permission !== 'granted') { failed++; continue; }
        await openAndRemember(await handle.getFile(), handle);
      } catch (err) {
        failed++;
      }
    }
    if (failed === 1) toast('1 PDF couldn’t be reopened. It may have been moved, renamed or deleted.');
    else if (failed > 1) toast(failed + ' PDFs couldn’t be reopened. They may have been moved, renamed or deleted.');
  });

  // ---------- Misc ----------

  const toastText = $('#toastText');
  const toastBtn = $('#toastBtn');
  let toastTimer = null;
  let toastAction = null;
  function toast(message, actionLabel, action) {
    toastText.textContent = message;
    toastAction = action || null;
    toastBtn.hidden = !action;
    toastBtn.textContent = actionLabel || '';
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; toastAction = null; }, action ? 8000 : 6000);
  }
  toastBtn.addEventListener('click', () => {
    const action = toastAction;
    toastAction = null;
    toastEl.hidden = true;
    if (action) action();
  });

  const installed = window.matchMedia('(display-mode: standalone), (display-mode: window-controls-overlay)').matches;
  $('#hint').textContent = installed
    ? 'Open a PDF from File Explorer with right-click, Open with, Sureshot PDF. This list is stored only on this PC.'
    : 'Install Sureshot PDF from the app icon in Edge’s address bar to open PDFs straight from File Explorer.';

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  activate(HOME);
  const ready = Promise.all([load('recents').catch(() => null), load('handles').catch(() => null)]).then(([r, h]) => {
    recents = Array.isArray(r) ? r.filter((x) => x && x.handle && x.id) : [];
    trimRecents();
    savedSession = Array.isArray(h) ? h : [];
    if (activeId === HOME) renderHome();
  });
})();
</script>
</body>
</html>
