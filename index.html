<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sureshot PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2328" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --chrome: #EEF1F3;
    --chrome-2: #E0E5E9;
    --sheet: #FFFFFF;
    --stage: #D9DEE2;
    --ink: #1C2530;
    --ink-soft: #5B6772;
    --line: #C9D1D8;
    --sight: #C8102E;
    --button-bg: #C8102E;
    --button-ink: #FFFFFF;
    --focus: #1B5FD6;
    --star: #B87800;
    --shadow: rgba(16, 24, 32, 0.18);
    --bar-h: env(titlebar-area-height, 40px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome: #1E2328;
      --chrome-2: #2B3138;
      --sheet: #343B43;
      --stage: #15191D;
      --ink: #E8ECEF;
      --ink-soft: #A3AEB8;
      --line: #4A545E;
      --sight: #FF6B7A;
      --button-bg: #D92A40;
      --button-ink: #FFFFFF;
      --focus: #8AB0FF;
      --star: #F2B53A;
      --shadow: rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--chrome);
    color: var(--ink);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg .fill { fill: none; }
  [aria-pressed="true"] svg .fill { fill: currentColor; }
  .muted { color: var(--ink-soft); }

  /* ---------- Tab strip (in the title bar when installed) ---------- */
  .bar {
    position: fixed;
    top: env(titlebar-area-y, 0px);
    left: env(titlebar-area-x, 0px);
    width: env(titlebar-area-width, 100%);
    height: var(--bar-h);
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 0 6px;
    -webkit-app-region: drag;
    app-region: drag;
  }
  .tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 100%;
    min-width: 0;
    flex: 0 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 1 auto;
    width: 200px;
    min-width: 96px;
    height: calc(var(--bar-h) - 6px);
    padding: 0 4px 0 12px;
    border-radius: 8px 8px 0 0;
    color: var(--ink-soft);
    user-select: none;
  }
  .tab:hover { background: var(--chrome-2); }
  .tab.active { background: var(--sheet); color: var(--ink); }
  .tab.partner { background: color-mix(in srgb, var(--sheet) 70%, var(--chrome)); color: var(--ink); }
  .tab.dragging { opacity: 0.45; }
  .tab:focus-visible { outline-offset: -2px; }
  .tab.home { flex: none; width: 44px; min-width: 44px; padding: 0; justify-content: center; }

  /* Sight mark: hollow on background tabs, centred dot on the tab you're looking at. */
  .mark {
    flex: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.45;
  }
  .tab.active .mark, .tab.partner .mark, .mark.on {
    border-color: var(--sight);
    background: radial-gradient(circle, var(--sight) 0 1.8px, transparent 2.4px);
    opacity: 1;
  }
  .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .close {
    flex: none;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    display: grid;
    place-items: center;
    opacity: 0.7;
  }
  .close:hover { background: var(--chrome-2); opacity: 1; }
  .tab.active .close:hover { background: var(--chrome); }
  .bar-btn {
    -webkit-app-region: no-drag;
    app-region: no-drag;
    flex: none;
    width: 30px;
    height: 30px;
    margin-bottom: 3px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    display: grid;
    place-items: center;
  }
  .bar-btn:hover { background: var(--chrome-2); }
  .bar-btn[aria-pressed="true"] { background: var(--sheet); color: var(--sight); }

  /* ---------- Stage ---------- */
  main {
    --split: 50%;
    position: fixed;
    top: var(--bar-h);
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--stage);
  }
  .frame {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    visibility: hidden;
    background: var(--stage);
  }
  .frame.active { visibility: visible; }
  .frame.pane-left { width: calc(var(--split) - 3px); }
  .frame.pane-right { left: calc(var(--split) + 3px); width: calc(100% - var(--split) - 3px); }
  .splitter {
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(var(--split) - 3px);
    width: 6px;
    z-index: 3;
    background: var(--line);
    cursor: col-resize;
    touch-action: none;
  }
  .splitter:hover, .splitter:focus-visible { background: var(--ink-soft); }
  main.resizing .frame { pointer-events: none; }

  /* ---------- Home ---------- */
  .home-view {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    background: var(--sheet);
  }
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 10px 16px;
    background: var(--chrome);
    border-right: 1px solid var(--line);
  }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 28px;
    margin: 12px 0 2px;
    padding: 0 4px 0 10px;
  }
  .nav-heading:first-child { margin-top: 0; }
  .nav-heading h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .nav-add {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    display: grid;
    place-items: center;
  }
  .nav-add:hover { background: var(--chrome-2); color: var(--ink); }
  .nav-note { margin: 0; padding: 2px 10px 6px; font-size: 12px; color: var(--ink-soft); }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    text-align: left;
    white-space: nowrap;
  }
  .nav-item:hover { background: var(--chrome-2); color: var(--ink); }
  .nav-item[aria-current="true"] { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--sight); }
  .nav-item.drop-target { outline: 2px dashed var(--sight); outline-offset: -2px; }
  .nav-icon { flex: none; width: 16px; height: 16px; display: grid; place-items: center; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nav-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 400; }
  .side-foot { margin-top: auto; padding: 20px 8px 0; font-size: 12px; color: var(--ink-soft); }
  .side-foot p { margin: 0 0 10px; }
  .link-btn { display: block; margin: 0 0 6px; border: 0; padding: 0; background: none; color: var(--ink-soft); text-decoration: underline; font-size: 12px; text-align: left; }
  .link-btn:hover { color: var(--ink); }

  .content { min-width: 0; min-height: 0; overflow-y: auto; padding: 28px 32px 56px; }
  .content-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
  .titles { flex: 1 1 auto; min-width: 0; }
  .titles h1 {
    margin: 0;
    font: 600 26px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .titles p { margin: 3px 0 0; color: var(--ink-soft); max-width: 70ch; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .primary, .secondary {
    min-height: 34px;
    padding: 6px 16px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .primary { border: 0; background: var(--button-bg); color: var(--button-ink); }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .secondary { border: 1px solid var(--line); background: transparent; }
  .secondary:hover:not(:disabled) { background: var(--chrome); }
  .primary:disabled, .secondary:disabled { opacity: 0.5; }
  .sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
  .icon-btn {
    flex: none;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    display: grid;
    place-items: center;
  }
  .icon-btn:hover:not(:disabled) { background: var(--chrome); color: var(--ink); }
  .icon-btn:disabled { opacity: 0.4; }
  .icon-btn.bordered { border: 1px solid var(--line); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
  .search { position: relative; flex: 1 1 260px; max-width: 440px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .search input {
    width: 100%;
    height: 34px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--chrome);
  }
  .search input::placeholder { color: var(--ink-soft); }
  .view-opts { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .field {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--sheet);
    color: var(--ink);
    min-width: 0;
  }
  textarea.field { height: auto; min-height: 96px; width: 100%; padding: 8px 10px; resize: vertical; line-height: 1.45; }
  input[type="text"].field, input[type="search"].field { width: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { width: 34px; height: 32px; border: 0; background: transparent; color: var(--ink-soft); display: grid; place-items: center; }
  .seg button[aria-pressed="true"] { background: var(--chrome-2); color: var(--ink); }

  /* ---------- Cards ---------- */
  .items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 14px; }
  .items.list { display: flex; flex-direction: column; gap: 6px; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--sheet);
    overflow: hidden;
  }
  .card:hover { border-color: var(--ink-soft); }
  .card.is-pinned { border-color: var(--ink-soft); }
  .card-open { display: flex; flex-direction: column; padding: 0; border: 0; background: transparent; text-align: left; min-width: 0; }
  .card-open:focus-visible { outline-offset: -2px; }
  .card-art {
    position: relative;
    height: 116px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--chrome);
    color: var(--ink-soft);
  }
  .card-art img.thumb { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; background: #fff; }
  .card-art.has-thumb img.thumb { display: block; }
  .card-art.has-thumb .doc-icon { display: none; }
  .card-badge {
    position: absolute;
    left: 8px;
    top: 8px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px 2px 6px;
    border-radius: 999px;
    background: var(--sheet);
    color: var(--sight);
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .card-body { display: block; padding: 10px 12px 2px; min-width: 0; }
  .card-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .card-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 3px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .card-meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta span:last-child { flex: none; }
  .card-note { display: flex; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
  .card-note svg { flex: none; margin-top: 1px; }
  .card-note span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { padding: 1px 8px; border-radius: 999px; background: var(--chrome); color: var(--ink-soft); font-size: 11px; }
  .chip.on { color: var(--sight); font-weight: 600; }
  .items.grid .chip.list-only { display: none; }
  .card-actions { display: flex; justify-content: flex-end; gap: 2px; margin-top: auto; padding: 2px 6px 6px; }
  .act {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    display: grid;
    place-items: center;
  }
  .act:hover { background: var(--chrome); color: var(--ink); }
  .act[aria-pressed="true"] { color: var(--ink); }
  .act.fav[aria-pressed="true"] { color: var(--star); }

  .items.list .card { flex-direction: row; align-items: center; border-radius: 8px; }
  .items.list .card-open { flex: 1; flex-direction: row; align-items: center; }
  .items.list .card-art { flex: none; width: 44px; height: 56px; margin: 6px 0 6px 8px; border-radius: 4px; }
  .items.list .card-art .doc-icon svg { width: 22px; height: 28px; }
  .items.list .card-badge { display: none; }
  .items.list .card-body { flex: 1; padding: 8px 12px; }
  .items.list .card-name { -webkit-line-clamp: 1; }
  .items.list .card-meta { justify-content: flex-start; gap: 16px; }
  .items.list .card-note span { -webkit-line-clamp: 1; }
  .items.list .card-actions { margin-top: 0; padding: 0 8px; }

  .section-title { margin: 28px 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .section-title:first-child { margin-top: 4px; }

  .notice { max-width: 62ch; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--chrome); }
  .notice h2 { margin: 0 0 6px; font: 600 16px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .notice p { margin: 0 0 12px; color: var(--ink-soft); }
  .notice p:last-child { margin-bottom: 0; }
  .notice .row { display: flex; flex-wrap: wrap; gap: 8px; }

  .first-run { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px 24px; text-align: center; }
  .first-run p { margin: 0; color: var(--ink-soft); max-width: 46ch; }
  .first-run h2 { margin: 0; font: 600 20px/1.25 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .reticle { width: 104px; height: 104px; color: color-mix(in srgb, var(--ink-soft) 55%, transparent); margin-bottom: 6px; }
  .reticle .dot { fill: var(--sight); }

  /* ---------- Search results ---------- */
  .hits { display: flex; flex-direction: column; gap: 10px; }
  .hit { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .hit-file { padding: 0; border: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; }
  .hit-file:hover { text-decoration: underline; }
  .hit-meta { margin: 2px 0 6px; font-size: 12px; color: var(--ink-soft); }
  .hit-page { display: flex; gap: 12px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
  .hit-page:hover { background: var(--chrome); }
  .hit-page b { flex: none; min-width: 52px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .hit-page span { font-size: 12.5px; }
  mark { padding: 0 1px; border-radius: 2px; background: color-mix(in srgb, var(--sight) 24%, transparent); color: inherit; }

  /* ---------- Tools ---------- */
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .tool {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--sheet);
    text-align: left;
  }
  .tool:hover { border-color: var(--ink-soft); background: var(--chrome); }
  .tool-icon { color: var(--sight); }
  .tool b { font-size: 14px; }
  .tool span { font-size: 12.5px; color: var(--ink-soft); }

  @media (max-width: 760px) {
    .home-view { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .side { flex-direction: row; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
    .nav { flex-direction: row; align-items: center; }
    .nav-heading { margin: 0 0 0 8px; }
    .nav-heading h2, .nav-note { display: none; }
    .nav-item { width: auto; }
    .side-foot { display: none; }
    .content { padding: 20px 16px 40px; }
  }

  /* ---------- Menus ---------- */
  .menu {
    position: fixed;
    z-index: 30;
    min-width: 220px;
    max-width: 320px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--sheet);
    box-shadow: 0 10px 30px var(--shadow);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 32px;
    padding: 0 12px 0 6px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--ink);
    text-align: left;
  }
  .menu-item:hover:not(:disabled), .menu-item:focus { background: var(--chrome); outline: none; }
  .menu-item:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
  .menu-item:disabled { color: var(--ink-soft); opacity: 0.6; }
  .menu-check { flex: none; width: 16px; display: grid; place-items: center; color: var(--sight); }
  .menu-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-sep { height: 1px; margin: 5px 4px; background: var(--line); }
  .menu-heading { padding: 6px 10px 2px 30px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }

  /* ---------- Dialogs ---------- */
  dialog {
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 48px);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--sheet);
    color: var(--ink);
    box-shadow: 0 20px 60px var(--shadow);
  }
  dialog::backdrop { background: rgba(15, 20, 25, 0.45); }
  .dlg { width: 560px; }
  .dlg[open] { display: flex; flex-direction: column; }
  .dlg.wide { width: 1120px; height: calc(100vh - 48px); }
  .dlg-head { display: flex; align-items: center; gap: 12px; padding: 16px 14px 8px 20px; }
  .dlg-head h2 { flex: 1; min-width: 0; margin: 0; font: 600 18px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; overflow-wrap: anywhere; }
  .dlg-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 18px; }
  .dlg-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  .status { margin-right: auto; font-size: 12.5px; color: var(--ink-soft); }
  .status.err, .err { color: var(--sight); }
  .small-dlg { width: 440px; padding: 20px; }
  .small-dlg h2 { margin: 0 0 14px; font: 600 18px/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .small-dlg .dlg-foot { padding: 14px 0 0; border-top: 0; }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 14px; }
  .field-label { font-size: 12.5px; font-weight: 600; }
  .help { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .choice { display: flex; align-items: flex-start; gap: 8px; margin: 2px 0 6px; }
  .choice input { margin-top: 3px; }
  .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .details h3 { margin: 18px 0 8px; font-size: 13px; }
  .details h3:first-child { margin-top: 4px; }
  .bm-list, .file-list { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .file-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; background: var(--chrome); }
  .empty-line { margin: 0 0 10px; color: var(--ink-soft); }
  .check-list { display: flex; flex-direction: column; gap: 4px; }

  .org-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 16px; }
  .org-top .form-row { flex: 1 1 320px; max-width: 520px; margin-bottom: 8px; }
  .org-bar {
    position: sticky;
    top: -8px;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    padding: 8px 0;

    background: var(--sheet);
  }

  .page-tile {
    display: flex;
    flex-direction: column;
    align-items: center;

  .page-tile.dragging { opacity: 0.4; }
  .page-canvas { width: 112px; height: 144px; display: grid; place-items: center; }
  .page-canvas > span { display: grid; place-items: center; transition: transform 0.15s; }
  .page-canvas canvas { display: block; max-width: 108px; max-height: 140px; background: #fff; box-shadow: 0 1px 3px var(--shadow); }

    flex-direction: column;
    align-items: center;

  .toast-btn { flex: none; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: inherit; font-weight: 600; text-decoration: underline; }
  .toast-btn:hover { background: color-mix(in srgb, var(--sheet) 15%, transparent); }
  kbd { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--chrome); font: 12px/1.5 "Segoe UI", system-ui, sans-serif; }
  .keys { width: 100%; border-collapse: collapse; }
  .keys td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .keys td:first-child { width: 46%; padding-right: 12px; }

<body>

<script>
(() => {
  'use strict';

  // ============================================================

  // DOM helpers and icons
  // ============================================================
  const $ = (sel, root = document) => root.querySelector(sel);

        else if (k === 'html') node.innerHTML = v;
        else if (k === 'value') node.value = v;
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);

    }
    for (const kid of kids.flat()) {

      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }
  const svg = (body, size = 16) =>
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';

  const ICONS = {
    home: svg('<path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.6V9.8H6.4v3.7H3a.5.5 0 0 1-.5-.5Z"/>'),
    plus: svg('<path d="M8 2.5v11M2.5 8h11"/>', 14),
    split: svg('<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M8 2.5v11"/>'),
    x: svg('<path d="M4 4l8 8M12 4l-8 8"/>'),
    xs: svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>', 10),
    pin: svg('<path class="fill" d="M9.8 1.8l4.4 4.4-1.8.7-2.3 2.3.3 3.1-.8.8-2.7-2.7-4 4H1.6v-1.3l4-4-2.7-2.7.8-.8 3.1.3 2.3-2.3Z"/>'),
    star: svg('<path class="fill" d="m8 1.7 1.9 4 4.3.5-3.2 3 .9 4.3L8 11.3l-3.9 2.2.9-4.3-3.2-3 4.3-.5Z"/>'),
    more: svg('<circle cx="3.5" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1.1" fill="currentColor" stroke="none"/>'),
    clock: svg('<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.5"/>'),
    day: svg('<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/>'),
    folder: svg('<path d="M1.8 4.2a1 1 0 0 1 1-1h3.4l1.5 1.6h5.5a1 1 0 0 1 1 1v6.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1Z"/>'),
    stack: svg('<rect x="2" y="5.5" width="12" height="8.5" rx="1.2"/><path d="M3.8 3.5h8.4M5.6 1.6h4.8"/>'),
    tools: svg('<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>'),
    grid: svg('<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>'),
    list: svg('<path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>'),
    search: svg('<circle cx="6.5" cy="6.5" r="4.5"/><path d="m10 10 3.5 3.5"/>', 14),
    check: svg('<path d="m3 8.5 3 3 7-7"/>', 14),
    note: svg('<path d="M3 2.5h10v8l-3 3H3Z"/><path d="M10 13.5v-3h3"/>', 13),
    bookmark: svg('<path d="M4 2h8v12l-4-3-4 3Z"/>'),
    rotL: svg('<path d="M3.2 7.5a5 5 0 1 1 1.4 3.7"/><path d="M3 3.2v4.3h4.3"/>'),
    rotR: svg('<path d="M12.8 7.5a5 5 0 1 0-1.4 3.7"/><path d="M13 3.2v4.3H8.7"/>'),
    up: svg('<path d="m4 10 4-4 4 4"/>'),
    down: svg('<path d="m4 6 4 4 4-4"/>'),
    trash: svg('<path d="M2.5 4h11M6.2 4V2.6h3.6V4M4 4l.7 9.4h6.6L12 4"/>'),
    organize: svg('<rect x="2" y="2" width="5" height="6" rx="1"/><rect x="9" y="2" width="5" height="6" rx="1"/><path d="M4.5 10.5v3h7v-3M9.5 12l2-1.5L13.5 12"/>', 22),
    merge: svg('<path d="M3 2v3.5c0 2.2 5 2.3 5 5V14M13 2v3.5c0 2.2-5 2.3-5 5"/>', 22),
    splitTool: svg('<path d="M8 2v3.5c0 2.2-5 2.3-5 5V14M8 5.5c0 2.2 5 2.3 5 5V14"/>', 22),
    image: svg('<rect x="2" y="2.5" width="12" height="11" rx="1.2"/><circle cx="6" cy="6.2" r="1.3"/><path d="m2.5 12 3.5-3.5 2.5 2.5 2-2 3 3"/>', 22),
    numbers: svg('<path d="M5.8 2 4.6 14M11.4 2l-1.2 12M2.5 5.5h11M2 10.5h11"/>', 22),
    watermark: svg('<path d="M8 2s4 4.5 4 7.3A4 4 0 0 1 4 9.3C4 6.5 8 2 8 2Z"/>', 22),
    stamp: svg('<path d="M6 2.5h4l-.8 5H6.8Z"/><path d="M2.5 10h11v2h-11ZM3 14h10"/>', 22),
    bigDoc: '<svg width="42" height="52" viewBox="0 0 42 52" aria-hidden="true"><path d="M5 2h22l11 11v35a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" style="fill:var(--sheet)" stroke="currentColor" stroke-width="1.6"/><path d="M27 2v11h11" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 24h20M10 30h20M10 36h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></svg>'
  };

  // ============================================================
  // Small utilities
  // ============================================================
  const uid = (prefix) => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sigOf = (file) => file.name + '|' + file.size + '|' + file.lastModified;
  const baseName = (name) => String(name || '').replace(/\.pdf$/i, '');
  const isPdf = (file) => !!file && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''));
  const plural = (n, word, many) => n + ' ' + (n === 1 ? word : (many || word + 's'));
  const idle = () => new Promise((resolve) => (window.requestIdleCallback ? requestIdleCallback(() => resolve(), { timeout: 400 }) : setTimeout(resolve, 30)));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

  function permissionError(name) {
    const err = new Error('Sureshot PDF needs your permission to read ' + name + '. Try again and choose Allow.');
    err.name = 'PermissionDenied';
    return err;
  }
  function friendly(err) {
    if (!err) return 'Something went wrong.';
    if (err.name === 'NotFoundError') return 'The file was moved, renamed or deleted.';
    if (err.name === 'PasswordException') return 'This PDF is password-protected, so Sureshot PDF can’t read its pages.';
    return err.message || String(err);
  }

  function sizeText(bytes) {
    if (typeof bytes !== 'number') return '';
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function startOfDay(time) {
    const d = new Date(time);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function bucketOf(time) {
    if (!time) return null;
    const today = startOfDay(Date.now());
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // Monday
    const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(weekStart.getDate() - 7);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    if (time >= today.getTime()) return 'today';
    if (time >= yesterday.getTime()) return 'yesterday';
    if (time >= weekStart.getTime()) return 'thisweek';
    if (time >= lastWeekStart.getTime()) return 'lastweek';
    if (time >= monthStart.getTime()) return 'thismonth';
    return 'older';
  }
  function shortDate(time) {
    const date = new Date(time);
    const sameYear = date.getFullYear() === new Date().getFullYear();
    return date.toLocaleDateString([], sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function whenText(time) {
    if (!time) return 'Not opened yet';
    const date = new Date(time);
    const clock = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const bucket = bucketOf(time);
    if (bucket === 'today') return 'Today, ' + clock;
    if (bucket === 'yesterday') return 'Yesterday, ' + clock;
    const days = Math.round((startOfDay(Date.now()) - startOfDay(time)) / DAY);
    if (days < 7) return date.toLocaleDateString([], { weekday: 'long' }) + ', ' + clock;
    return shortDate(time);
  }

  // ============================================================
  // Elements
  // ============================================================
  const tabsEl = $('#tabs');
  const homeTab = $('#tab-home');
  const homeEl = $('#home');
  const stage = $('#stage');
  const dropEl = $('#drop');
  const splitter = $('#splitter');
  const splitBtn = $('#splitBtn');
  const navEl = $('#nav');
  const viewBody = $('#viewBody');
  const headActions = $('#headActions');
  const viewTitle = $('#viewTitle');
  const viewSub = $('#viewSub');
  const searchEl = $('#search');
  const sortSel = $('#sortSel');
  const viewOpts = $('#viewOpts');
  const gridBtn = $('#gridBtn');
  const listBtn = $('#listBtn');
  const menuEl = $('#menu');
  const dlg = $('#dlg');
  const promptDlg = $('#promptDlg');
  const toastEl = $('#toast');

  const clearBtn = $('#clearBtn');

  homeTab.innerHTML = ICONS.home;
  $('#addBtn').innerHTML = ICONS.plus;
  splitBtn.innerHTML = ICONS.split;

  gridBtn.innerHTML = ICONS.grid;
  listBtn.innerHTML = ICONS.list;

  // ============================================================
  // State
  // ============================================================
  /** Open tabs: {id, name, key (signature), url, file, handle, recordId, tabEl, frame} */
  const tabs = [];
  let activeId = HOME;
  let nextTabId = 1;
  let splitRightId = null;
  let mru = [];                       // tab ids, most recently viewed first
  let warnedManyTabs = false;

  /** Remembered files: {id, name, size, sig, lastModified, lastOpened, handle, pinned, favourite, note, bookmarks[], addedAt} */
  let records = [];
  /** Collections: {id, name, kind: 'manual'|'folder', fileIds[], dirHandle, createdAt} */
  let collections = [];
  let savedSession = [];
  const folderCache = new Map();      // collection id -> {status, items, error}
  const fileCache = new Map();        // record id -> File (this session only)

  let currentView = 'all';

  let layout = 'grid';
  try {
    currentView = localStorage.getItem('sureshot.view') || 'all';

  let resolveReady;
  const ready = new Promise((resolve) => { resolveReady = resolve; });

  // ============================================================
  // Storage (IndexedDB, in this app on this PC)
  // ============================================================
  let dbPromise = null;
  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject(new Error('Storage isn’t available.')); return; }
        const req = indexedDB.open('sureshot-pdf', 2);
        req.onupgradeneeded = () => {
          const db = req.result;
          for (const name of ['session', 'thumbs', 'text']) {
            if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => db.close();
          resolve(db);
        };
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('Close other Sureshot PDF windows and try again.'));
      });
    }
    return dbPromise;
  }
  async function dbRun(store, mode, op) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, mode);
      const req = op(tx.objectStore(store));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  }
  const dbGet = (store, key) => dbRun(store, 'readonly', (s) => s.get(key));
  const dbPut = (store, key, value) => dbRun(store, 'readwrite', (s) => s.put(value, key));
  const dbKeys = (store) => dbRun(store, 'readonly', (s) => s.getAllKeys());
  async function dbEntries(store) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const st = tx.objectStore(store);
      const keys = st.getAllKeys();
      const values = st.getAll();
      tx.oncomplete = () => resolve(keys.result.map((k, i) => [k, values.result[i]]));
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  }

  let saveRecordsTimer = null;
  function saveRecords() {
    clearTimeout(saveRecordsTimer);
    saveRecordsTimer = setTimeout(() => { dbPut('session', 'recents', records).catch(() => {}); }, 150);
  }
  function saveCollections() {
    dbPut('session', 'collections', collections).catch(() => {});
  }
  let saveSessionTimer = null;
  function saveSession() {
    clearTimeout(saveSessionTimer);
    saveSessionTimer = setTimeout(() => {
      dbPut('session', 'handles', tabs.filter((t) => t.handle).map((t) => t.handle)).catch(() => {});
    }, 300);
  }

  // ============================================================
  // Records (remembered files)
  // ============================================================
  const recordById = (id) => records.find((r) => r.id === id);
  const collectionById = (id) => collections.find((c) => c.id === id);
  const manualCollections = () => collections.filter((c) => c.kind === 'manual');
  const inManualCollection = (id) => collections.some((c) => c.kind === 'manual' && c.fileIds.includes(id));
  const isKept = (r) => r.pinned || r.favourite || !!(r.note && r.note.trim()) || (r.bookmarks && r.bookmarks.length > 0) || inManualCollection(r.id);

  // Kept files stay forever; everything else is limited to the newest MAX_RECENTS.
  function trimRecords() {
    const opened = records.filter((r) => r.lastOpened).sort((a, b) => b.lastOpened - a.lastOpened);
    const allowed = new Set();
    let n = 0;
    for (const r of opened) {
      if (isKept(r)) continue;
      n++;
      if (n <= MAX_RECENTS) allowed.add(r.id);
    }
    records = records.filter((r) => isKept(r) || allowed.has(r.id));
  }

  async function findRecordByHandle(handle) {
    for (const r of records) {
      try {
        if (await r.handle.isSameEntry(handle)) return r;
      } catch (err) { /* stale handle */ }
    }
    return null;
  }

  let rememberChain = Promise.resolve();
  function rememberFile(handle, file, opened) {
    const run = rememberChain.then(async () => {
      await ready;
      let r = await findRecordByHandle(handle);
      if (!r) {
        r = { id: uid('r'), pinned: false, favourite: false, note: '', bookmarks: [], lastOpened: null, addedAt: Date.now() };
        records.unshift(r);
      }
      r.handle = handle;
      r.name = file.name;
      r.size = file.size;
      r.sig = sigOf(file);
      r.lastModified = file.lastModified;
      fileCache.set(r.id, file);
      if (opened) {
        r.lastOpened = Date.now();
        trimRecords();
      }
      saveRecords();
      return r;
    });
    rememberChain = run.catch(() => {});
    return run;
  }

  async function ensurePermission(handle, mode, request) {
    try {
      let state = await handle.queryPermission({ mode: mode || 'read' });
      if (state !== 'granted' && request) state = await handle.requestPermission({ mode: mode || 'read' });
      return state === 'granted';
    } catch (err) {
      return false;
    }
  }

  async function getRecordFile(r, request = true) {
    if (!(await ensurePermission(r.handle, 'read', request))) throw permissionError(r.name);
    const file = await r.handle.getFile();
    if (sigOf(file) !== r.sig) {
      r.name = file.name; r.size = file.size; r.sig = sigOf(file); r.lastModified = file.lastModified;
      saveRecords();
    }
    fileCache.set(r.id, file);
    return file;
  }

  function removeRecord(id, offerUndo) {
    const index = records.findIndex((r) => r.id === id);
    if (index < 0) return;
    const [entry] = records.splice(index, 1);
    const memberships = [];
    for (const c of manualCollections()) {
      const i = c.fileIds.indexOf(id);
      if (i >= 0) { memberships.push([c, i]); c.fileIds.splice(i, 1); }
    }
    saveRecords();
    if (memberships.length) saveCollections();
    renderHomeSoon();
    if (offerUndo) {
      toast('Removed ' + entry.name + ' from the list. The file itself wasn’t deleted.', 'Undo', () => {
        records.splice(Math.min(index, records.length), 0, entry);
        for (const [c, i] of memberships) if (collections.includes(c)) c.fileIds.splice(Math.min(i, c.fileIds.length), 0, id);
        saveRecords();
        saveCollections();
        renderHomeSoon();
      });
    }
  }

  // ============================================================
  // Display items (a remembered file, or a PDF found in a linked folder)
  // ============================================================
  function itemFromRecord(r) {
    return { key: r.id, record: r, name: r.name, size: r.size, sig: r.sig, when: r.lastOpened, modified: r.lastModified, path: null, handle: r.handle };
  }
  function itemFromFolder(f) {
    const r = records.find((x) => x.sig && x.sig === f.sig) || null;
    return { key: r ? r.id : f.key, record: r, name: f.name, size: f.size, sig: f.sig, when: r ? r.lastOpened : null, modified: f.lastModified, path: f.path, handle: f.handle, folderItem: f };
  }
  function findOpenTabForItem(item) {
    if (item.record) {
      const t = tabs.find((x) => x.recordId === item.record.id);
      if (t) return t;
    }
    return item.sig ? tabs.find((x) => x.key === item.sig) || null : null;
  }
  async function ensureRecordForItem(item) {
    if (item.record) return item.record;
    const file = await item.handle.getFile();
    const r = await rememberFile(item.handle, file, false);
    item.record = r;
    return r;
  }
  async function itemFile(item) {
    const t = findOpenTabForItem(item);
    if (t) return t.file;
    if (item.record) return getRecordFile(item.record);
    return item.handle.getFile();
  }
  function sortItems(items) {
    const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    const cmp = {
      recent: (a, b) => (b.when || b.modified || 0) - (a.when || a.modified || 0),
      name: byName,
      size: (a, b) => (b.size || 0) - (a.size || 0)
    }[sortBy] || byName;
    const pinned = (it) => (it.record && it.record.pinned ? 1 : 0);
    return items.slice().sort((a, b) => pinned(b) - pinned(a) || cmp(a, b) || byName(a, b));
  }

  // ============================================================
  // Tabs
  // ============================================================
  const findTab = (id) => tabs.find((t) => t.id === id);

  function openFile(file, handle, page) {
    if (!file) return null;
    if (!isPdf(file)) {
      toast('Skipped ' + file.name + '. Sureshot PDF opens PDF files only.');
      return null;
    }
    const key = sigOf(file);
    const existing = tabs.find((t) => t.key === key);
    if (existing) {
      if (handle && !existing.handle) existing.handle = handle;
      activate(existing.id);
      if (page) goToPage(existing, page);
      return existing;
    }

    const id = nextTabId++;
    const url = URL.createObjectURL(new Blob([file], { type: 'application/pdf' }));

    const close = el('button', { type: 'button', class: 'close', tabindex: '-1', title: 'Close', 'aria-label': 'Close ' + file.name, html: ICONS.xs });
    const tabEl = el('div', {
      class: 'tab', id: 'tab-' + id, title: file.name, tabindex: '-1', role: 'tab',
      'aria-controls': 'frame-' + id, 'aria-selected': 'false', draggable: 'true'
    }, el('span', { class: 'mark', 'aria-hidden': 'true' }), el('span', { class: 'title', text: baseName(file.name) }), close);

    const frame = el('iframe', { class: 'frame', id: 'frame-' + id, title: file.name, role: 'tabpanel', 'aria-labelledby': 'tab-' + id });
    frame.src = url + (page ? '#page=' + page : '');

    const tab = { id, name: file.name, key, url, file, handle: handle || null, recordId: null, tabEl, frame };

    tabEl.addEventListener('click', (e) => { if (!e.target.closest('.close')) activate(id); });
    tabEl.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    tabEl.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); closeTab(id); } });
    tabEl.addEventListener('keydown', onTabKey);
    tabEl.addEventListener('contextmenu', (e) => { e.preventDefault(); showTabMenu(tab, { x: e.clientX, y: e.clientY }); });
    tabEl.addEventListener('dragstart', (e) => {
      draggingTab = tab;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('application/x-sureshot-tab', String(id));
      tabEl.classList.add('dragging');
    });
    tabEl.addEventListener('dragend', () => {
      tabEl.classList.remove('dragging');
      draggingTab = null;
      const order = Array.from(tabsEl.children);
      tabs.sort((a, b) => order.indexOf(a.tabEl) - order.indexOf(b.tabEl));
      saveSession();
    });
    close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });

    stage.insertBefore(frame, splitter);
    tabsEl.appendChild(tabEl);
    tabs.push(tab);
    activate(id);
    saveSession();

    // Build the preview and search text once the viewer has had a moment to load.
    setTimeout(() => scheduleIndex(key, () => Promise.resolve(file)), 1500);

    if (tabs.length >= MANY_TABS && !warnedManyTabs) {
      warnedManyTabs = true;
      toast('You have ' + tabs.length + ' PDFs open. Each tab uses memory, so close the ones you’re finished with.');
    }
    return tab;
  }

  function goToPage(tab, page) {
    tab.frame.src = tab.url + '#page=' + page;
  }

  function activate(id) {
    if (id !== HOME && splitRightId === id) {
      // Clicking the right-hand PDF swaps the two panes.
      splitRightId = activeId !== HOME && findTab(activeId) ? activeId : null;
    }
    activeId = id;
    const onHome = id === HOME;
    if (!onHome) mru = [id].concat(mru.filter((x) => x !== id));

    homeTab.classList.toggle('active', onHome);
    homeTab.setAttribute('aria-selected', String(onHome));
    homeTab.tabIndex = onHome ? 0 : -1;
    homeEl.hidden = !onHome;

    for (const t of tabs) {
      const on = t.id === id;
      t.tabEl.classList.toggle('active', on);
      t.tabEl.setAttribute('aria-selected', String(on));
      t.tabEl.tabIndex = on ? 0 : -1;
    }
    layoutFrames();
    const t = findTab(id);
    document.title = t ? t.name + ' — ' + APP : APP;
    if (t) t.tabEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (onHome) renderHome();
  }

  function layoutFrames() {
    if (splitRightId !== null && !findTab(splitRightId)) splitRightId = null;
    const split = activeId !== HOME && splitRightId !== null && splitRightId !== activeId;
    for (const t of tabs) {
      const left = t.id === activeId;
      const right = split && t.id === splitRightId;
      t.frame.classList.toggle('active', left || right);
      t.frame.classList.toggle('pane-left', left && split);
      t.frame.classList.toggle('pane-right', right);
      t.tabEl.classList.toggle('partner', right);
    }
    splitter.hidden = !split;
    splitBtn.hidden = tabs.length < 2;
    splitBtn.setAttribute('aria-pressed', String(split));
    splitBtn.title = split ? 'Close split view' : 'Split view: show two PDFs side by side';
    splitBtn.setAttribute('aria-label', split ? 'Close split view' : 'Split view');
  }

  function showBeside(tabId) {
    const left = activeId !== HOME && activeId !== tabId ? activeId : mru.find((x) => x !== tabId && findTab(x));
    if (!left) { toast('Open another PDF first, then show the two side by side.'); return; }
    splitRightId = tabId;
    activate(left);
  }
  function toggleSplit() {
    const split = activeId !== HOME && splitRightId !== null && splitRightId !== activeId;
    if (split) { splitRightId = null; layoutFrames(); return; }
    const left = activeId !== HOME ? activeId : mru.find((x) => findTab(x));
    const right = mru.find((x) => x !== left && findTab(x)) || (tabs.find((t) => t.id !== left) || {}).id;
    if (!left || !right) return;
    splitRightId = right;
    activate(left);
  }

  function closeTab(id) {
    const index = tabs.findIndex((t) => t.id === id);
    if (index < 0) return;
    const [t] = tabs.splice(index, 1);
    const hadFocus = t.tabEl.contains(document.activeElement);
    t.tabEl.remove();
    t.frame.remove();
    setTimeout(() => URL.revokeObjectURL(t.url), 1000);
    mru = mru.filter((x) => x !== id);
    if (splitRightId === id) splitRightId = null;

    if (activeId === id) {
      const next = (splitRightId !== null && findTab(splitRightId)) || findTab(mru[0]) || tabs[Math.min(index, tabs.length - 1)];
      if (next && splitRightId === next.id) splitRightId = null;
      activate(next ? next.id : HOME);
      if (hadFocus) (next ? next.tabEl : homeTab).focus();
    } else {
      layoutFrames();
      renderHomeSoon();
    }
    saveSession();
  }
  function closeOtherTabs(keepId) {
    for (const t of tabs.slice()) if (t.id !== keepId) closeTab(t.id);
  }

  function tabOrder() { return [HOME].concat(tabs.map((t) => t.id)); }
  function elOf(id) { return id === HOME ? homeTab : findTab(id).tabEl; }
  function cycleTabs(step) {
    const order = tabOrder();
    const i = order.indexOf(activeId);
    const next = order[(i + step + order.length) % order.length];
    activate(next);
  }
  function onTabKey(e) {
    const order = tabOrder();
    const current = e.currentTarget === homeTab ? HOME : (tabs.find((t) => t.tabEl === e.currentTarget) || {}).id;
    const i = order.indexOf(current);
    if (i < 0) return;
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % order.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + order.length) % order.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = order.length - 1;
    else if (e.key === 'Delete' && current !== HOME) { e.preventDefault(); closeTab(current); return; }
    else if ((e.key === 'Enter' || e.key === ' ') && current === HOME) { e.preventDefault(); activate(HOME); return; }
    else if ((e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) && current !== HOME) {
      e.preventDefault();
      showTabMenu(findTab(current), e.currentTarget);
      return;
    }
    if (j !== null) {
      e.preventDefault();
      activate(order[j]);
      elOf(order[j]).focus();
    }
  }
  homeTab.addEventListener('click', () => activate(HOME));
  homeTab.addEventListener('keydown', onTabKey);
  splitBtn.addEventListener('click', toggleSplit);

  // Reordering tabs by dragging
  let draggingTab = null;
  tabsEl.addEventListener('dragover', (e) => {
    if (!draggingTab) return;
    e.preventDefault();
    const target = e.target.closest('.tab');
    if (!target || target === draggingTab.tabEl || target.parentNode !== tabsEl) return;
    const r = target.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    tabsEl.insertBefore(draggingTab.tabEl, after ? target.nextSibling : target);
  });
  tabsEl.addEventListener('drop', (e) => { if (draggingTab) e.preventDefault(); });

  // Resizing split view
  splitter.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    stage.classList.add('resizing');
    const move = (ev) => {
      const r = stage.getBoundingClientRect();
      stage.style.setProperty('--split', clamp(((ev.clientX - r.left) / r.width) * 100, 20, 80) + '%');
    };
    const up = () => {
      stage.classList.remove('resizing');
      splitter.removeEventListener('pointermove', move);
      splitter.removeEventListener('pointerup', up);
      splitter.removeEventListener('pointercancel', up);
    };
    splitter.addEventListener('pointermove', move);
    splitter.addEventListener('pointerup', up);
    splitter.addEventListener('pointercancel', up);
  });
  splitter.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const current = parseFloat(getComputedStyle(stage).getPropertyValue('--split')) || 50;
    stage.style.setProperty('--split', clamp(current + (e.key === 'ArrowLeft' ? -5 : 5), 20, 80) + '%');
  });

  // ============================================================
  // Opening files
  // ============================================================
  async function openAndRemember(file, handle, page) {
    const tab = openFile(file, handle, page);
    if (tab && handle) {
      try {
        const r = await rememberFile(handle, file, true);
        tab.recordId = r.id;
      } catch (err) { /* remembering is a convenience */ }
      renderHomeSoon();
    }
    return tab;
  }

  async function openHandle(handle, page) {
    let file;
    try {
      file = await handle.getFile();
    } catch (err) {
      toast('Couldn’t open ' + handle.name + '. ' + friendly(err));
      return null;
    }
    return openAndRemember(file, handle, page);
  }

  async function openRecord(r, page) {
    const open = tabs.find((t) => t.recordId === r.id);
    if (open) {
      r.lastOpened = Date.now();
      saveRecords();
      activate(open.id);
      if (page) goToPage(open, page);
      renderHomeSoon();
      return open;
    }
    let file;
    try {
      file = await getRecordFile(r);
    } catch (err) {
      if (err.name === 'NotFoundError') {
        toast(r.name + ' was moved, renamed or deleted.', 'Remove from list', () => removeRecord(r.id, false));
      } else {
        toast(err.name === 'PermissionDenied' ? err.message : 'Couldn’t open ' + r.name + '. ' + friendly(err));
      }
      return null;
    }
    return openAndRemember(file, r.handle, page);
  }

  async function openItem(item, page) {
    if (item.record) return openRecord(item.record, page);
    try {
      const file = await item.handle.getFile();
      return await openAndRemember(file, item.handle, page);
    } catch (err) {
      toast('Couldn’t open ' + item.name + '. ' + friendly(err));
      return null;
    }
  }

  async function openBeside(item) {
    const left = activeId !== HOME ? activeId : mru.find((x) => findTab(x));
    const tab = await openItem(item);
    if (!tab) return;
    if (!left || left === tab.id || !findTab(left)) { toast('Open another PDF first, then show the two side by side.'); return; }
    splitRightId = tab.id;
    activate(left);
  }

  // Lets the person pick PDFs; returns {file, handle} pairs.
  async function pickPdfs(multiple) {
    if ('showOpenFilePicker' in window) {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: !!multiple,
          types: [{ description: 'PDF files', accept: { 'application/pdf': ['.pdf'] } }]
        });
        const out = [];
        for (const h of handles) out.push({ file: await h.getFile(), handle: h });
        return out;
      } catch (err) {
        if (err.name !== 'AbortError') toast('Couldn’t show the file picker. ' + friendly(err));
        return [];
      }
    }
    const files = await pickWithInput('application/pdf,.pdf', multiple);
    return files.map((file) => ({ file, handle: null }));
  }
  async function pickImages(multiple) {
    if ('showOpenFilePicker' in window) {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: !!multiple,
          types: [{ description: 'Images', accept: { 'image/*': ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'] } }]
        });
        const out = [];
        for (const h of handles) out.push(await h.getFile());
        return out;
      } catch (err) {
        if (err.name !== 'AbortError') toast('Couldn’t show the file picker. ' + friendly(err));
        return [];
      }
    }
    return pickWithInput('image/*', multiple);
  }
  function pickWithInput(accept, multiple) {
    return new Promise((resolve) => {
      fileInput.accept = accept;
      fileInput.multiple = !!multiple;
      fileInput.value = '';
      const done = () => {
        fileInput.removeEventListener('change', done);
        fileInput.removeEventListener('cancel', done);
        resolve(Array.from(fileInput.files || []));
      };
      fileInput.addEventListener('change', done);
      fileInput.addEventListener('cancel', done);
      fileInput.click();
    });
  }

  async function chooseAndOpen() {
    const picked = await pickPdfs(true);
    for (const p of picked) {
      if (p.handle) await openAndRemember(p.file, p.handle);
      else openFile(p.file, null);
    }
  }
  $('#addBtn').addEventListener('click', chooseAndOpen);

  // PDFs opened from File Explorer ("Open with > Sureshot PDF")
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async (params) => {
      if (!params.files || !params.files.length) return;
      for (const h of params.files) if (h.kind === 'file') await openHandle(h);
    });
  }

  // Drag and drop from File Explorer
  let dragDepth = 0;
  const hasFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e) || dlg.open || promptDlg.open) return;
    e.preventDefault();
    dragDepth++;
    dropEl.hidden = false;
  });
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = dlg.open || promptDlg.open ? 'none' : 'copy';
  });
  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropEl.hidden = true;
  });
  window.addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropEl.hidden = true;
    if (dlg.open || promptDlg.open) return;
    // Everything must be read from the drop event before the first await.
    const entries = Array.from(e.dataTransfer.items)
      .filter((item) => item.kind === 'file')
      .map((item) => ({
        file: item.getAsFile(),
        handle: item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null)
      }));
    for (const entry of entries) {
      const handle = await entry.handle;
      if (handle && handle.kind === 'file') await openAndRemember(entry.file, handle);
      else openFile(entry.file, null);
    }
  });

  // ============================================================
  // Collections
  // ============================================================
  function collectionCount(col) {
    if (col.kind === 'manual') return col.fileIds.length;
    const cache = folderCache.get(col.id);
    return cache && cache.status === 'ok' ? cache.items.length : null;
  }

  function toggleMembership(col, r) {
    const i = col.fileIds.indexOf(r.id);
    if (i >= 0) {
      col.fileIds.splice(i, 1);
      toast('Removed ' + r.name + ' from “' + col.name + '”.');
    } else {
      col.fileIds.push(r.id);
      toast('Added ' + r.name + ' to “' + col.name + '”.');
    }
    saveCollections();
    saveRecords();
    renderHomeSoon();
  }

  function removeFromCollection(col, recordId, offerUndo) {
    const i = col.fileIds.indexOf(recordId);
    if (i < 0) return;
    col.fileIds.splice(i, 1);
    saveCollections();
    renderHomeSoon();
    const r = recordById(recordId);
    if (offerUndo) {
      toast('Removed ' + (r ? r.name : 'the PDF') + ' from “' + col.name + '”.', 'Undo', () => {
        if (!col.fileIds.includes(recordId)) col.fileIds.splice(Math.min(i, col.fileIds.length), 0, recordId);
        saveCollections();
        renderHomeSoon();
      });
    }
  }

  async function createCollectionFlow(opts = {}) {
    const col = await newCollectionDialog(opts);
    if (!col) return null;
    collections.push(col);
    saveCollections();
    if (col.kind === 'folder') {
      folderCache.set(col.id, { status: 'scanning', items: [] });
      scanFolder(col, { request: false });
    }
    if (opts.show !== false) {
      activate(HOME);
      setView('c:' + col.id);
    } else {
      renderHomeSoon();
    }
    toast('Created “' + col.name + '”.' + (opts.fileIds && opts.fileIds.length && col.kind === 'manual' ? ' ' + plural(opts.fileIds.length, 'PDF') + ' added.' : ''));
    return col;
  }

  async function renameCollection(col) {
    const name = await promptDialog({ title: 'Rename collection', label: 'Name', value: col.name, okLabel: 'Rename' });
    if (!name) return;
    col.name = name;
    saveCollections();
    renderHomeSoon();
  }

  function deleteCollection(col) {
    const index = collections.indexOf(col);
    if (index < 0) return;
    collections.splice(index, 1);
    if (currentView === 'c:' + col.id) currentView = 'all';
    saveCollections();
    renderHomeSoon();
    toast('Deleted the collection “' + col.name + '”. Your PDFs weren’t affected.', 'Undo', () => {
      collections.splice(Math.min(index, collections.length), 0, col);
      saveCollections();
      renderHomeSoon();
    });
  }

  async function openAll(col) {
    let items;
    if (col.kind === 'folder') {
      if (!(await ensurePermission(col.dirHandle, 'read', true))) {
        toast('Sureshot PDF needs permission to read the folder “' + col.dirHandle.name + '”.');
        return;
      }
      const cache = folderCache.get(col.id);
      if (!cache || cache.status !== 'ok') await scanFolder(col, { request: false });
      items = ((folderCache.get(col.id) || {}).items || []).map(itemFromFolder);
    } else {
      items = col.fileIds.map(recordById).filter(Boolean).map(itemFromRecord);
    }
    if (!items.length) { toast('“' + col.name + '” has no PDFs to open.'); return; }
    if (items.length > OPEN_ALL_CONFIRM && !window.confirm('Open all ' + items.length + ' PDFs in “' + col.name + '”? Each open PDF uses memory.')) return;

    let first = null;
    let failed = 0;
    for (const item of sortItems(items)) {
      let tab = findOpenTabForItem(item);
      if (!tab) {
        try {
          const file = item.record ? await getRecordFile(item.record) : await item.handle.getFile();
          tab = await openAndRemember(file, item.record ? item.record.handle : item.handle);
        } catch (err) {
          failed++;
        }
      }
      if (tab && !first) first = tab;
    }
    if (first) activate(first.id);
    if (failed) toast(plural(failed, 'PDF') + ' couldn’t be opened. Open them one at a time to allow access, or they may have been moved.');
  }

  async function saveTabsAsCollection() {
    const ids = Array.from(new Set(tabs.map((t) => t.recordId).filter(Boolean)));
    if (!ids.length) { toast('None of the open PDFs can be added to a collection.'); return; }
    const name = await promptDialog({
      title: 'Save open tabs as a collection',
      label: 'Collection name',
      value: 'Session ' + new Date().toLocaleDateString([], { day: 'numeric', month: 'short' }),
      okLabel: 'Save'
    });
    if (!name) return;
    const col = { id: uid('c'), name, kind: 'manual', fileIds: ids, createdAt: Date.now() };
    collections.push(col);
    saveCollections();
    saveRecords();
    renderHomeSoon();
    const skipped = tabs.length - ids.length;
    toast('Saved ' + plural(ids.length, 'PDF') + ' as “' + name + '”.' + (skipped ? ' ' + plural(skipped, 'tab') + ' couldn’t be added.' : ''), 'Show', () => {
      activate(HOME);
      setView('c:' + col.id);
    });
  }

  async function scanFolder(col, { request } = {}) {
    const dir = col.dirHandle;
    if (!dir) return;
    if (!(await ensurePermission(dir, 'read', request))) {
      folderCache.set(col.id, { status: 'needs-permission', items: [] });
      renderHomeSoon();
      return;
    }
    const previous = folderCache.get(col.id);
    folderCache.set(col.id, { status: 'scanning', items: previous ? previous.items : [] });
    renderHomeSoon();
    const items = [];
    let truncated = false;
    async function walk(handle, prefix, depth) {
      for await (const [name, entry] of handle.entries()) {
        if (items.length >= FOLDER_LIMIT) { truncated = true; return; }
        if (entry.kind === 'file' && /\.pdf$/i.test(name)) {
          const file = await entry.getFile();
          items.push({ key: 'f:' + col.id + ':' + prefix + name, name, path: prefix, handle: entry, size: file.size, lastModified: file.lastModified, sig: sigOf(file) });
        } else if (entry.kind === 'directory' && depth < 4 && !name.startsWith('.')) {
          await walk(entry, prefix + name + '/', depth + 1);
        }
      }
    }
    try {
      await walk(dir, '', 0);
      folderCache.set(col.id, { status: 'ok', items, truncated });
    } catch (err) {
      folderCache.set(col.id, { status: 'error', items: [], error: friendly(err) });
    }
    renderHomeSoon();
  }

  function indexFolder(col) {
    const cache = folderCache.get(col.id);
    if (!cache || cache.status !== 'ok') return;
    for (const f of cache.items) scheduleIndex(f.sig, () => f.handle.getFile());
    renderHomeSoon();
  }

  // ============================================================
  // Previews and text search index (built with PDF.js)
  // ============================================================
  const scriptLoads = {};
  function loadScript(url) {
    if (!scriptLoads[url]) {
      scriptLoads[url] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = () => {
          delete scriptLoads[url];
          s.remove();
          reject(new Error('Couldn’t download a part of Sureshot PDF. Check your internet connection and try again.'));
        };
        document.head.appendChild(s);
      });
    }
    return scriptLoads[url];
  }
  async function getPdfjs() {
    await loadScript(CDN.pdfjs);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
    return window.pdfjsLib;
  }
  async function getPdfLib() {
    await loadScript(CDN.pdflib);
    return window.PDFLib;
  }
  async function openPdfjsDoc(bytes) {
    const pdfjs = await getPdfjs();
    return pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
  }

  const indexedSigs = new Set();
  const indexQueue = [];
  let indexing = false;
  let textCache = null;              // sig -> [page text]
  const thumbUrls = new Map();       // sig -> object URL or null

  function scheduleIndex(sig, getFile) {
    if (!sig || indexedSigs.has(sig) || indexQueue.some((q) => q.sig === sig)) return;
    indexQueue.push({ sig, getFile });
    runIndexQueue();
  }
  async function runIndexQueue() {
    if (indexing) return;
    indexing = true;
    try {
      while (indexQueue.length) {
        const job = indexQueue.shift();
        if (indexedSigs.has(job.sig)) continue;
        try {
          const file = await job.getFile();
          await indexFile(job.sig, file);
        } catch (err) {
          // Unreadable or protected files are recorded as empty so they aren't retried endlessly.
          await dbPut('text', job.sig, { pages: [], failed: true, indexedAt: Date.now() }).catch(() => {});
          if (textCache) textCache.set(job.sig, []);
        }
        indexedSigs.add(job.sig);
        onIndexed(job.sig);
        await idle();
      }
    } finally {
      indexing = false;
      if (activeId === HOME && !searchEl.value.trim()) renderHomeSoon();
    }
  }

  async function indexFile(sig, file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const doc = await openPdfjsDoc(bytes);
    try {
      const first = await doc.getPage(1);
      const base = first.getViewport({ scale: 1 });
      const viewport = first.getViewport({ scale: 360 / base.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.min(Math.round(viewport.height), 720);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await first.render({ canvasContext: ctx, viewport }).promise;
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
      if (blob) await dbPut('thumbs', sig, blob);

      const pages = [];
      let total = 0;
      for (let i = 1; i <= doc.numPages && total < TEXT_LIMIT; i++) {
        const page = i === 1 ? first : await doc.getPage(i);
        const content = await page.getTextContent();
        let text = content.items.map((it) => it.str + (it.hasEOL ? ' ' : '')).join(' ').replace(/\s+/g, ' ').trim();
        if (total + text.length > TEXT_LIMIT) text = text.slice(0, TEXT_LIMIT - total);
        total += text.length;
        pages.push(text);
        if (i % 8 === 0) await idle();
      }
      await dbPut('text', sig, { pages, numPages: doc.numPages, indexedAt: Date.now() });
      if (textCache) textCache.set(sig, pages);
    } finally {
      doc.destroy();
    }
  }

  function onIndexed(sig) {
    thumbUrls.delete(sig);
    document.querySelectorAll('img.thumb').forEach((img) => {
      if (img.dataset.sig === sig) { img.removeAttribute('src'); hydrateThumb(img); }
    });
    if (activeId === HOME && currentView.startsWith('c:')) {
      const col = collectionById(currentView.slice(2));
      if (col && col.kind === 'folder' && !searchEl.value.trim()) viewSub.textContent = folderSubText(col);
    }
    if (activeId === HOME && searchEl.value.trim()) renderHomeSoon();
  }

  async function thumbUrl(sig) {
    if (thumbUrls.has(sig)) return thumbUrls.get(sig);
    const blob = await dbGet('thumbs', sig).catch(() => null);
    const url = blob ? URL.createObjectURL(blob) : null;
    thumbUrls.set(sig, url);
    return url;
  }
  async function hydrateThumb(img) {
    const url = await thumbUrl(img.dataset.sig);
    if (url && img.isConnected) {
      img.src = url;
      img.parentElement.classList.add('has-thumb');
    }
  }
  function hydrateThumbs(root) {
    root.querySelectorAll('img.thumb[data-sig]:not([src])').forEach(hydrateThumb);
  }

  async function loadTextCache() {
    if (textCache) return textCache;
    const entries = await dbEntries('text').catch(() => []);
    textCache = new Map(entries.map(([k, v]) => [k, v && Array.isArray(v.pages) ? v.pages : []]));
    return textCache;
  }

  // ============================================================
  // Home: views

  const LIBRARY_VIEWS = [
    { id: 'pinned', label: 'Pinned', icon: 'pin', test: (r) => r.pinned,

    { id: 'favourites', label: 'Favourites', icon: 'star', test: (r) => r.favourite,
      empty: ['No favourites yet', 'Star a PDF to collect it here. Favourites are never dropped from your library.'] },

  ].map(([id, label]) => ({ id, label, icon: 'day', test: (r) => bucketOf(r.lastOpened) === id, empty: ['Nothing here', 'No PDFs were opened in this period.'] }));
  const ALL_VIEWS = LIBRARY_VIEWS.concat(DATE_VIEWS);

  let currentItems = new Map();
  let currentCtx = { kind: 'library' };

  function setView(id) {
    currentView = id;
    try { localStorage.setItem('sureshot.view', id); } catch (err) { /* ignore */ }
    if (searchEl.value) searchEl.value = '';

    $('#content').scrollTop = 0;
  }

  let renderQueued = false;
  function renderHomeSoon() {
    if (renderQueued) return;

  function button(cls, text, onclick, extra) {

  }
  function iconButton(icon, label, onclick, extra) {
    return el('button', Object.assign({ type: 'button', class: 'icon-btn bordered', title: label, 'aria-label': label, html: ICONS[icon], onclick }, extra || {}));
  }

  function commonActions() {
    const actions = [];

      actions.push(button('secondary', savedSession.length === 1 ? 'Reopen last session’s PDF' : 'Reopen last session’s ' + savedSession.length + ' PDFs', restoreSession));

  function setHead(title, sub, actions, showViewOpts = true) {

  function renderHome() {
    renderNav();
    clearBtn.hidden = !records.some((r) => r.lastOpened);

    const query = searchEl.value.trim();
    if (query) { renderSearch(query); return; }
    if (currentView === 'tools') { renderToolsView(); return; }
    if (currentView.startsWith('c:')) {
      const col = collectionById(currentView.slice(2));
      if (col) { renderCollectionView(col); return; }

  // ---------- Sidebar ----------
  function navHeading(text, extra) {
    return el('div', { class: 'nav-heading' }, el('h2', { text }), extra || null);
  }
  function navButton(id, label, icon, count) {
    const current = !searchEl.value.trim() && currentView === id;
    return el('button', { type: 'button', class: 'nav-item', dataset: { view: id }, 'aria-current': current ? 'true' : null },
      el('span', { class: 'nav-icon', html: icon }),
      el('span', { class: 'nav-label', text: label }),
      el('span', { class: 'nav-count', text: count ? String(count) : '' }));
  }
  function renderNav() {
    const focused = navEl.contains(document.activeElement) && document.activeElement.dataset ? document.activeElement.dataset.view : null;
    const parts = [navHeading('Library')];
    for (const v of LIBRARY_VIEWS) parts.push(navButton(v.id, v.label, ICONS[v.icon], records.filter(v.test).length));

    const dates = DATE_VIEWS.filter((v) => records.some(v.test) || currentView === v.id);
    if (dates.length) {
      parts.push(navHeading('By date'));
      for (const v of dates) parts.push(navButton(v.id, v.label, ICONS.day, records.filter(v.test).length));
    }

    parts.push(navHeading('Collections', el('button', { type: 'button', class: 'nav-add', title: 'New collection', 'aria-label': 'New collection', html: ICONS.plus, onclick: () => createCollectionFlow() })));
    if (!collections.length) parts.push(el('p', { class: 'nav-note', text: 'Group PDFs by project, or link a folder.' }));
    for (const col of collections) {
      const b = navButton('c:' + col.id, col.name, col.kind === 'folder' ? ICONS.folder : ICONS.stack, collectionCount(col));
      b.title = col.kind === 'folder' ? col.name + ' (linked folder)' : col.name;
      b.addEventListener('contextmenu', (e) => { e.preventDefault(); showCollectionMenu(col, { x: e.clientX, y: e.clientY }); });
      if (col.kind === 'manual') {
        b.addEventListener('dragover', (e) => {
          if (!Array.from(e.dataTransfer.types).includes('application/x-sureshot-item')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
          b.classList.add('drop-target');
        });
        b.addEventListener('dragleave', () => b.classList.remove('drop-target'));
        b.addEventListener('drop', async (e) => {
          b.classList.remove('drop-target');
          const key = e.dataTransfer.getData('application/x-sureshot-item');
          const item = key && currentItems.get(key);
          if (!item) return;
          e.preventDefault();
          try {
            const r = await ensureRecordForItem(item);
            if (col.fileIds.includes(r.id)) { toast(r.name + ' is already in “' + col.name + '”.'); return; }
            toggleMembership(col, r);
          } catch (err) {
            toast('Couldn’t add ' + item.name + '. ' + friendly(err));
          }
        });
      }
      parts.push(b);
    }

    parts.push(navHeading('Tools'));
    parts.push(navButton('tools', 'Page tools', ICONS.tools, null));
    navEl.replaceChildren(...parts);
    if (focused) {
      const again = navEl.querySelector('[data-view="' + CSS.escape(focused) + '"]');
      if (again) again.focus();
    }
  }
  navEl.addEventListener('click', (e) => {

  // ---------- Library and date views ----------

      viewBody.replaceChildren(firstRunBlock());
      return;

    if (!items.length) {
      viewBody.replaceChildren(notice(view.empty[0], view.empty[1]));

  }

  function firstRunBlock() {

  }
  function notice(title, text, buttons) {
    return el('div', { class: 'notice' }, el('h2', { text: title }), el('p', { text }), buttons && buttons.length ? el('div', { class: 'row' }, buttons) : null);
  }

  // ---------- Collection views ----------
  function folderSubText(col) {
    const cache = folderCache.get(col.id);
    const folderName = col.dirHandle ? col.dirHandle.name : 'the folder';
    if (!cache || cache.status === 'scanning') return 'Reading “' + folderName + '”…';
    if (cache.status !== 'ok') return 'Linked to the folder “' + folderName + '”.';
    const n = cache.items.length;
    const indexed = cache.items.filter((f) => indexedSigs.has(f.sig)).length;
    let text = plural(n, 'PDF') + ' in “' + folderName + '” and its subfolders' + (cache.truncated ? ' (showing the first ' + FOLDER_LIMIT + ')' : '') + '.';
    if (n) {
      const pending = cache.items.filter((f) => indexQueue.some((q) => q.sig === f.sig)).length;
      if (pending) text += ' Building previews: ' + pending + ' to go.';
      else text += ' ' + indexed + ' of ' + n + ' have previews and text search.';

  }

  function renderCollectionView(col) {
    const more = iconButton('more', 'More actions for this collection', (e) => showCollectionMenu(col, e.currentTarget), { 'aria-haspopup': 'menu' });
    if (col.kind === 'manual') {
      currentCtx = { kind: 'collection', col };

      setHead(col.name, plural(items.length, 'PDF') + ' in this collection.', [
        button('primary', 'Open all', () => openAll(col), { disabled: items.length ? null : true }),
        more
      ], items.length > 0);
      viewBody.replaceChildren(items.length
        ? renderItems(items, currentCtx)
        : notice('This collection is empty', 'Add PDFs with the More actions menu on any PDF, by dragging a PDF onto this collection in the sidebar, or by right-clicking a tab.'));
      return;
    }

    currentCtx = { kind: 'folder', col };
    let cache = folderCache.get(col.id);
    if (!cache) {
      cache = { status: 'scanning', items: [] };
      folderCache.set(col.id, cache);
      scanFolder(col, { request: false });
    }
    const actions = [];
    if (cache.status === 'ok' && cache.items.length) {
      actions.push(button('primary', 'Open all', () => openAll(col)));
      if (cache.items.some((f) => !indexedSigs.has(f.sig) && !indexQueue.some((q) => q.sig === f.sig))) {
        actions.push(button('secondary', 'Build previews and search', () => indexFolder(col), {

        }));

    actions.push(more);

    const items = sortItems(cache.items.map(itemFromFolder));

        : notice('No PDFs in this folder', 'PDFs you save into “' + col.dirHandle.name + '” appear here when you rescan.'));

  }

  viewBody.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target || !viewBody.contains(target)) return;
    const item = currentItems.get(target.dataset.key);
    if (!item) return;
    const page = target.dataset.page ? Number(target.dataset.page) : null;
    switch (target.dataset.action) {
      case 'open': openItem(item, page); break;
      case 'pin': toggleItemFlag(item, 'pinned'); break;
      case 'fav': toggleItemFlag(item, 'favourite'); break;
      case 'more': showItemMenu(item, target); break;
      case 'remove':
        if (currentCtx.kind === 'collection') removeFromCollection(currentCtx.col, item.record.id, true);
        else removeRecord(item.record.id, true);
        break;
    }
  });
  viewBody.addEventListener('auxclick', (e) => {
    const target = e.target.closest('[data-action="open"]');
    if (target && e.button === 1) {
      e.preventDefault();
      const item = currentItems.get(target.dataset.key);
      if (item) openItem(item);
    }
  });
  viewBody.addEventListener('contextmenu', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const item = currentItems.get(card.dataset.key);
    if (!item) return;
    e.preventDefault();
    showItemMenu(item, { x: e.clientX, y: e.clientY });
  });
  viewBody.addEventListener('dragstart', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    e.dataTransfer.effectAllowed = 'copy';
    e.dataTransfer.setData('application/x-sureshot-item', card.dataset.key);
  });

  async function toggleItemFlag(item, flag) {
    let r;
    try {
      r = await ensureRecordForItem(item);
    } catch (err) {
      toast('Couldn’t update ' + item.name + '. ' + friendly(err));
      return;
    }
    r[flag] = !r[flag];
    trimRecords();
    saveRecords();
    renderHome();
    const again = viewBody.querySelector('.act.' + (flag === 'pinned' ? 'pin' : 'fav') + '[data-key="' + CSS.escape(r.id) + '"]') ||
      viewBody.querySelector('.act.' + (flag === 'pinned' ? 'pin' : 'fav') + '[data-key="' + CSS.escape(item.key) + '"]');
    if (again) again.focus();
  }

  function withRecord(item, fn) {
    ensureRecordForItem(item).then(fn).catch((err) => toast('Couldn’t do that for ' + item.name + '. ' + friendly(err)));
  }

  function showItemMenu(item, anchor) {
    const r = item.record;
    const entries = [
      { label: 'Open', onClick: () => openItem(item) },
      { label: 'Open beside current PDF', disabled: !tabs.length, hint: tabs.length ? null : 'Open a PDF first', onClick: () => openBeside(item) },
      { label: 'Notes and bookmarks…', onClick: () => withRecord(item, openDetails) },
      { sep: true },
      { heading: 'Add to collection' }
    ];
    for (const c of manualCollections()) {
      entries.push({ label: c.name, checked: !!r && c.fileIds.includes(r.id), onClick: () => withRecord(item, (rec) => toggleMembership(c, rec)) });
