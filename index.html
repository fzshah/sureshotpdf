    entries.push({ label: 'New collection…', onClick: () => withRecord(item, (rec) => createCollectionFlow({ fileIds: [rec.id], show: false })) });
    entries.push({ sep: true });

    entries.push({ label: 'Share…', onClick: () => shareItem(item) });

    entries.push({ label: 'Close tab', onClick: () => closeTab(tab.id) });

  // ---------- Search ----------
  let searchToken = 0;
  function allKnownItems() {
    const out = records.map(itemFromRecord);
    const seen = new Set(out.map((i) => i.sig).filter(Boolean));
    for (const [, cache] of folderCache) {
      if (cache.status !== 'ok') continue;
      for (const f of cache.items) {
        if (seen.has(f.sig)) continue;
        seen.add(f.sig);
        out.push(itemFromFolder(f));
      }
    }
    return out;
  }
  function snippet(text, index, length) {
    const start = Math.max(0, index - 70);
    const end = Math.min(text.length, index + length + 90);
    return el('span', {},
      (start > 0 ? '…' : '') + text.slice(start, index),
      el('mark', { text: text.slice(index, index + length) }),
      text.slice(index + length, end) + (end < text.length ? '…' : ''));
  }

  async function renderSearch(query) {
    const token = ++searchToken;
    currentCtx = { kind: 'search' };
    const q = query.toLowerCase();
    const universe = allKnownItems();
    const nameHits = sortItems(universe.filter((it) => it.name.toLowerCase().includes(q) || (it.record && it.record.note && it.record.note.toLowerCase().includes(q))));
    setHead('Search results', 'Searching…', commonActions(), false);
    const parts = [];
    if (nameHits.length) {
      parts.push(el('h2', { class: 'section-title', text: 'Names and notes' }));
      parts.push(renderItems(nameHits, currentCtx));
    }
    viewBody.replaceChildren(...parts);

    const cache = await loadTextCache();
    if (token !== searchToken) return;
    const contentHits = [];
    for (const it of universe) {
      if (!it.sig) continue;
      const pages = cache.get(it.sig);
      if (!pages || !pages.length) continue;
      const hits = [];
      let pageCount = 0;
      for (let i = 0; i < pages.length; i++) {
        const idx = pages[i].toLowerCase().indexOf(q);
        if (idx < 0) continue;
        pageCount++;
        if (hits.length < 3) hits.push({ page: i + 1, text: pages[i], idx });
      }
      if (pageCount) contentHits.push({ it, hits, pageCount });
      if (contentHits.length >= 100) break;
    }
    if (contentHits.length) {
      viewBody.append(el('h2', { class: 'section-title', text: 'Inside PDFs' }));
      const list = el('div', { class: 'hits' });
      for (const { it, hits, pageCount } of contentHits) {
        currentItems.set(it.key, it);
        const block = el('div', { class: 'hit' },
          el('button', { type: 'button', class: 'hit-file', dataset: { action: 'open', key: it.key }, text: baseName(it.name) }),
          el('div', { class: 'hit-meta', text: 'Found on ' + plural(pageCount, 'page') + (pageCount > hits.length ? '. Showing the first ' + hits.length + '.' : '.') }));
        for (const h of hits) {
          block.append(el('button', { type: 'button', class: 'hit-page', dataset: { action: 'open', key: it.key, page: String(h.page) }, title: 'Open at page ' + h.page },
            el('b', { text: 'Page ' + h.page }), snippet(h.text, h.idx, q.length)));
        }
        list.append(block);
      }
      viewBody.append(list);
    }
    const indexedCount = universe.filter((it) => it.sig && cache.has(it.sig)).length;
    const total = nameHits.length + contentHits.length;
    if (!total) {
      viewBody.replaceChildren(notice('No matches for “' + query + '”', 'Text search covers PDFs you’ve opened since this version of Sureshot PDF, plus linked folders where you chose Build previews and search. Scanned PDFs without a text layer can’t be searched.'));
    }
    viewSub.textContent = plural(total, 'match', 'matches') + '. Text search covers ' + indexedCount + ' of ' + plural(universe.length, 'PDF') + '.';
  }

  let searchTimer = null;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderHome, 160);
  });
  searchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchEl.value) { searchEl.value = ''; renderHome(); }
  });

  // ---------- Sort and layout ----------
  sortSel.value = sortBy;
  sortSel.addEventListener('change', () => {
    sortBy = sortSel.value;
    try { localStorage.setItem('sureshot.sort', sortBy); } catch (err) { /* ignore */ }
    renderHome();
  });
  function setLayout(next) {
    layout = next;
    try { localStorage.setItem('sureshot.layout', next); } catch (err) { /* ignore */ }
    gridBtn.setAttribute('aria-pressed', String(next === 'grid'));
    listBtn.setAttribute('aria-pressed', String(next === 'list'));
    renderHome();
  }
  gridBtn.addEventListener('click', () => setLayout('grid'));
  listBtn.addEventListener('click', () => setLayout('list'));
  gridBtn.setAttribute('aria-pressed', String(layout !== 'list'));
  listBtn.setAttribute('aria-pressed', String(layout === 'list'));

  // ---------- Clear and restore ----------
  clearBtn.addEventListener('click', () => {
    const kept = records.filter(isKept).length;
    const message = kept
      ? 'Clear the Recent list? Your ' + plural(kept, 'PDF') + ' that are pinned, favourited, in a collection, or have notes will stay in your library. No files will be deleted.'
      : 'Clear the Recent list? No files will be deleted.';
    if (!window.confirm(message)) return;
    records = records.filter(isKept);
    for (const r of records) r.lastOpened = null;
    saveRecords();
    searchEl.value = '';
    renderHome();

  async function restoreSession() {
    const list = savedSession;
    savedSession = [];
    renderHome();
    let failed = 0;
    for (const handle of list) {
      try {
        if (!(await ensurePermission(handle, 'read', true))) { failed++; continue; }
        await openAndRemember(await handle.getFile(), handle);
      } catch (err) {
        failed++;
      }
    }
    if (failed) toast(plural(failed, 'PDF') + ' couldn’t be reopened. They may have been moved, renamed or deleted.');
  }

  // ============================================================
  // Menus
  // ============================================================
  let menuReturnFocus = null;
  function showMenu(anchor, entries) {
    closeMenu(false);
    menuEl.replaceChildren();
    for (const it of entries) {
      if (!it) continue;
      if (it.sep) { menuEl.append(el('div', { class: 'menu-sep', role: 'separator' })); continue; }
      if (it.heading) { menuEl.append(el('div', { class: 'menu-heading', 'aria-hidden': 'true', text: it.heading })); continue; }
      const isCheck = it.checked !== undefined;
      const item = el('button', {
        type: 'button', class: 'menu-item', role: isCheck ? 'menuitemcheckbox' : 'menuitem',
        'aria-checked': isCheck ? String(!!it.checked) : null, disabled: it.disabled ? true : null, title: it.hint || null, tabindex: '-1'
      }, el('span', { class: 'menu-check', html: it.checked ? ICONS.check : '' }), el('span', { class: 'menu-label', text: it.label }));
      item.addEventListener('click', () => {
        closeMenu(true);
        if (it.onClick) it.onClick();
      });
      menuEl.append(item);
    }
    menuEl.hidden = false;
    menuReturnFocus = document.activeElement;
    const w = menuEl.offsetWidth;
    const h = menuEl.offsetHeight;
    let x;
    let y;
    if (anchor instanceof Element) {
      const r = anchor.getBoundingClientRect();
      x = r.right - w;
      y = r.bottom + 4;
      if (y + h > innerHeight - 8) y = r.top - h - 4;
    } else {
      x = anchor.x;
      y = anchor.y;
      if (y + h > innerHeight - 8) y = anchor.y - h;
    }
    menuEl.style.left = clamp(x, 8, innerWidth - w - 8) + 'px';
    menuEl.style.top = clamp(y, 8, innerHeight - h - 8) + 'px';
    const first = menuEl.querySelector('.menu-item:not(:disabled)');
    if (first) first.focus();
  }
  function closeMenu(restoreFocus) {
    if (menuEl.hidden) return;
    menuEl.hidden = true;
    if (restoreFocus !== false && menuReturnFocus && document.contains(menuReturnFocus)) menuReturnFocus.focus({ preventScroll: true });
    menuReturnFocus = null;
  }
  document.addEventListener('pointerdown', (e) => {
    if (!menuEl.hidden && !menuEl.contains(e.target)) closeMenu(false);
  }, true);
  window.addEventListener('blur', () => closeMenu(false));
  window.addEventListener('resize', () => closeMenu(false));
  menuEl.addEventListener('keydown', (e) => {
    const items = Array.from(menuEl.querySelectorAll('.menu-item:not(:disabled)'));
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[(i + 1) % items.length] || items[0]).focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (items[(i - 1 + items.length) % items.length] || items[0]).focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeMenu(true); }
  });

  // ============================================================
  // Dialogs
  // ============================================================
  let dialogSeq = 0;
  let dialogState = null;
  function openDialog({ title, body, footer, size }) {
    if (dlg.open) { finishDialog(); dlg.close(); }
    closeMenu(false);
    const state = { seq: ++dialogSeq, cleanup: null };
    dialogState = state;
    dlg.className = 'dlg' + (size ? ' ' + size : '');
    dlg.replaceChildren(
      el('div', { class: 'dlg-head' },
        el('h2', { id: 'dlgTitle', text: title }),
        el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', title: 'Close', html: ICONS.x, onclick: () => dlg.close() })),
      el('div', { class: 'dlg-body' }, body),
      footer ? el('div', { class: 'dlg-foot' }, footer) : null);
    dlg.showModal();
    return state;
  }
  function finishDialog() {
    const s = dialogState;
    dialogState = null;
    if (s && s.cleanup) s.cleanup();
  }
  dlg.addEventListener('close', () => {
    if (dlg.open) return;
    finishDialog();
  });

  function promptDialog({ title, label, value = '', okLabel = 'Save' }) {
    return new Promise((resolve) => {
      let result = null;
      const input = el('input', { type: 'text', class: 'field', id: 'promptInput', value, autocomplete: 'off' });
      const err = el('p', { class: 'err', role: 'alert' });
      const form = el('form', { method: 'dialog' },
        el('h2', { text: title }),
        el('div', { class: 'form-row' }, el('label', { class: 'field-label', for: 'promptInput', text: label }), input, err),
        el('div', { class: 'dlg-foot' },
          button('secondary', 'Cancel', () => promptDlg.close()),
          el('button', { type: 'submit', class: 'primary', text: okLabel })));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = input.value.trim();
        if (!v) { err.textContent = 'Enter a name.'; input.focus(); return; }
        result = v;
        promptDlg.close();
      });
      promptDlg.replaceChildren(form);
      promptDlg.onclose = () => { promptDlg.onclose = null; resolve(result); };
      promptDlg.showModal();
      input.select();
    });
  }

  function newCollectionDialog({ fileIds = [] } = {}) {
    return new Promise((resolve) => {
      let result = null;
      let dirHandle = null;
      const canLink = 'showDirectoryPicker' in window;
      const nameInput = el('input', { type: 'text', class: 'field', id: 'ncName', autocomplete: 'off', placeholder: 'For example, Riverside project' });
      const manual = el('input', { type: 'radio', name: 'ncKind', id: 'ncManual', value: 'manual', checked: true });
      const folder = el('input', { type: 'radio', name: 'ncKind', id: 'ncFolder', value: 'folder', disabled: canLink ? null : true });
      const folderName = el('span', { class: 'muted', text: 'No folder chosen' });
      const folderRow = el('div', { class: 'inline', hidden: true },
        button('secondary sm', 'Choose folder…', async () => {
          try {
            dirHandle = await window.showDirectoryPicker({ mode: 'read' });
            folderName.textContent = dirHandle.name;
            if (!nameInput.value.trim()) nameInput.value = dirHandle.name;
            err.textContent = '';
          } catch (e) { /* cancelled */ }
        }), folderName);
      const err = el('p', { class: 'err', role: 'alert' });
      const sync = () => { folderRow.hidden = !folder.checked; };
      manual.addEventListener('change', sync);
      folder.addEventListener('change', sync);

      const form = el('form', { method: 'dialog' },
        el('h2', { text: 'New collection' }),
        el('div', { class: 'form-row' }, el('label', { class: 'field-label', for: 'ncName', text: 'Name' }), nameInput),
        el('div', { class: 'form-row', role: 'radiogroup', 'aria-label': 'Kind of collection' },
          el('label', { class: 'choice', for: 'ncManual' }, manual, el('span', {}, el('b', { text: 'Pick PDFs' }), el('br'), el('span', { class: 'help', text: 'Add PDFs yourself from anywhere on your PC.' }))),
          el('label', { class: 'choice', for: 'ncFolder' }, folder, el('span', {}, el('b', { text: 'Link a folder' }), el('br'), el('span', { class: 'help', text: canLink ? 'Shows every PDF in a folder and its subfolders, including new ones. Edge asks for access once per session at most.' : 'Not available in this browser.' }))),
          folderRow),
        err,
        el('div', { class: 'dlg-foot' },
          button('secondary', 'Cancel', () => promptDlg.close()),
          el('button', { type: 'submit', class: 'primary', text: 'Create' })));

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name) { err.textContent = 'Enter a name for the collection.'; nameInput.focus(); return; }
        if (folder.checked && !dirHandle) { err.textContent = 'Choose the folder to link.'; return; }
        result = folder.checked
          ? { id: uid('c'), name, kind: 'folder', fileIds: [], dirHandle, createdAt: Date.now() }
          : { id: uid('c'), name, kind: 'manual', fileIds: fileIds.slice(), createdAt: Date.now() };
        promptDlg.close();
      });
      promptDlg.replaceChildren(form);
      promptDlg.onclose = () => { promptDlg.onclose = null; resolve(result); };
      promptDlg.showModal();
      nameInput.focus();
    });
  }

  // ---------- Notes, bookmarks and collections for one file ----------
  function openDetails(r) {
    if (!r) return;
    const note = el('textarea', { class: 'field', id: 'detailsNote', placeholder: 'For example: waiting on the revised version from council' });
    note.value = r.note || '';
    let noteTimer = null;
    note.addEventListener('input', () => {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { r.note = note.value; saveRecords(); }, 300);
    });

    const bmList = el('ul', { class: 'bm-list' });
    const drawBookmarks = () => {
      const marks = (r.bookmarks || []).slice().sort((a, b) => a.page - b.page);
      bmList.replaceChildren(...marks.map((b) => el('li', { class: 'bm' },
        el('button', { type: 'button', class: 'bm-open', title: 'Open at page ' + b.page, onclick: () => { dlg.close(); openRecord(r, b.page); } },
          el('b', { text: 'Page ' + b.page }), b.label || ''),
        el('button', { type: 'button', class: 'icon-btn', title: 'Delete bookmark', 'aria-label': 'Delete bookmark for page ' + b.page, html: ICONS.x,
          onclick: () => { r.bookmarks = r.bookmarks.filter((x) => x !== b); saveRecords(); drawBookmarks(); } }))));
      if (!marks.length) bmList.replaceChildren(el('li', { class: 'empty-line', text: 'No bookmarks yet.' }));
    };
    drawBookmarks();
    const pageInput = el('input', { type: 'number', class: 'field', id: 'bmPage', min: '1', step: '1', style: 'width: 96px' });
    const labelInput = el('input', { type: 'text', class: 'field', id: 'bmLabel', placeholder: 'Label, for example Clause 9', style: 'flex: 1; min-width: 160px' });
    const bmErr = el('p', { class: 'err', role: 'alert' });
    const addBookmark = () => {
      const page = Number(pageInput.value);
      if (!Number.isInteger(page) || page < 1) { bmErr.textContent = 'Enter a page number.'; pageInput.focus(); return; }
      bmErr.textContent = '';
      r.bookmarks = (r.bookmarks || []).concat({ id: uid('b'), page, label: labelInput.value.trim() });
      saveRecords();
      pageInput.value = '';
      labelInput.value = '';
      drawBookmarks();
      pageInput.focus();
    };
    labelInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBookmark(); } });
    pageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBookmark(); } });

    const colList = el('div', { class: 'check-list' });
    const drawCollections = () => {
      const manual = manualCollections();
      colList.replaceChildren(...manual.map((c) => {
        const box = el('input', { type: 'checkbox', id: 'dc-' + c.id, checked: c.fileIds.includes(r.id) ? true : null });
        box.addEventListener('change', () => {
          const i = c.fileIds.indexOf(r.id);
          if (box.checked && i < 0) c.fileIds.push(r.id);
          if (!box.checked && i >= 0) c.fileIds.splice(i, 1);
          saveCollections();
        });
        return el('label', { class: 'choice', for: 'dc-' + c.id }, box, c.name);
      }));
      if (!manual.length) colList.replaceChildren(el('p', { class: 'empty-line', text: 'No collections yet.' }));
      colList.append(el('div', {}, button('secondary sm', 'New collection…', async () => {
        const col = await createCollectionFlow({ fileIds: [r.id], show: false });
        if (col) drawCollections();
      })));
    };
    drawCollections();

    const meta = [sizeText(r.size), r.lastOpened ? 'last opened ' + whenText(r.lastOpened).toLowerCase() : 'not opened yet'].filter(Boolean).join(', ');
    const body = el('div', { class: 'details' },
      el('p', { class: 'help', text: r.name + ', ' + meta + '.' }),
      el('h3', {}, el('label', { for: 'detailsNote', text: 'Notes' })),
      note,
      el('h3', { text: 'Bookmarks' }),
      el('p', { class: 'help', text: 'Jump straight to a page. Edge’s viewer can’t tell Sureshot PDF which page you’re on, so enter the page number.', style: 'margin-bottom: 8px' }),
      bmList,
      el('div', { class: 'inline' },
        el('label', { class: 'sr-only', for: 'bmPage', text: 'Page number' }), pageInput,
        el('label', { class: 'sr-only', for: 'bmLabel', text: 'Bookmark label' }), labelInput,
        button('secondary', 'Add bookmark', addBookmark)),
      bmErr,
      el('h3', { text: 'Collections' }),
      colList);

    const state = openDialog({ title: baseName(r.name), body, footer: [button('primary', 'Done', () => dlg.close())] });

  // A PDF picker for tools: open tabs, recent files, or a file from the PC.
  // The file is read as soon as it's chosen, so any permission prompt appears while you're interacting.
  function sourceField({ preset, label = 'PDF', onLoad } = {}) {
    const select = el('select', { class: 'field' });
    const cache = new Map();
    const browsed = new Map();
    const presetItem = preset && preset.item;
    const presetTab = preset && preset.tabId ? findTab(preset.tabId) : presetItem ? findOpenTabForItem(presetItem) : null;

    if (presetItem && !presetTab) select.append(el('option', { value: 'p:', text: presetItem.name }));
    if (tabs.length) {
      const g = el('optgroup', { label: 'Open tabs' });
      for (const t of tabs) g.append(el('option', { value: 't:' + t.id, text: t.name }));
      select.append(g);
    }
    const recent = records.filter((r) => r.lastOpened && !tabs.some((t) => t.recordId === r.id)).sort((a, b) => b.lastOpened - a.lastOpened).slice(0, 25);
    if (recent.length) {
      const g = el('optgroup', { label: 'Recent' });
      for (const r of recent) g.append(el('option', { value: 'r:' + r.id, text: r.name }));
      select.append(g);
    }
    const browseOption = el('option', { value: 'browse', text: 'Browse your PC…' });
    select.append(browseOption);

    let initial = '';
    if (presetTab) initial = 't:' + presetTab.id;
    else if (presetItem) initial = 'p:';
    else if (activeId !== HOME && findTab(activeId)) initial = 't:' + activeId;
    else if (tabs.length) initial = 't:' + tabs[0].id;
    if (!initial) {
      select.prepend(el('option', { value: '', text: 'Choose a PDF…' }));
    }
    select.value = initial;
    let previous = select.value;

    function resolveValue(v) {
      if (cache.has(v)) return cache.get(v);
      let p;
      if (v.startsWith('t:')) {
        const t = findTab(Number(v.slice(2)));
        p = t ? Promise.resolve(t.file) : Promise.reject(new Error('That tab has been closed. Choose another PDF.'));
      } else if (v.startsWith('r:')) {
        const r = recordById(v.slice(2));
        p = r ? getRecordFile(r) : Promise.reject(new Error('That PDF is no longer in your library.'));
      } else if (v === 'p:') {
        p = itemFile(presetItem);
      } else if (v.startsWith('b:')) {
        p = Promise.resolve(browsed.get(v));
      } else {
        p = Promise.reject(new Error('Choose a PDF first.'));
      }
      cache.set(v, p);
      p.catch(() => cache.delete(v));
      return p;
    }
    async function changed() {
      if (select.value === 'browse') {
        const picked = await pickPdfs(false);
        if (picked.length) {
          const v = 'b:' + uid('');
          browsed.set(v, picked[0].file);
          select.insertBefore(el('option', { value: v, text: picked[0].file.name }), browseOption);
          select.value = v;
        } else {
          select.value = previous;
          return;
        }
      }
      previous = select.value;
      const placeholder = select.querySelector('option[value=""]');
      if (placeholder && select.value) placeholder.remove();
      if (onLoad && select.value) onLoad(resolveValue(select.value));
    }
    select.addEventListener('change', changed);
    if (onLoad && select.value) setTimeout(() => onLoad(resolveValue(select.value)), 0);
    else if (select.value) resolveValue(select.value).catch(() => {});
    return {
      node: formRow(label, select),
      select,
      get: () => resolveValue(select.value),
      name: () => (select.selectedOptions[0] ? select.selectedOptions[0].textContent : 'document.pdf')
    };
  }

  async function loadForEditing(file) {
    const { PDFDocument } = await getPdfLib();
    const bytes = new Uint8Array(await file.arrayBuffer());
    try {
      return await PDFDocument.load(bytes, { updateMetadata: false });
    } catch (err) {
      if (/encrypt/i.test(err.message || '')) throw new Error(file.name + ' is password-protected, so its pages can’t be changed.');
      throw new Error('Couldn’t read ' + file.name + '. It may be damaged.');
    }
  }

  function downloadBytes(bytes, name) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = el('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  }

  // The save dialog must open while the click is still "fresh", so ask for the location first, then build the PDF.
  async function saveWith(suggestedName, produce, progress) {
    let handle = null;
    if ('showSaveFilePicker' in window) {
      try {
        handle = await window.showSaveFilePicker({ suggestedName, types: [{ description: 'PDF file', accept: { 'application/pdf': ['.pdf'] } }] });
      } catch (err) {
        if (err.name === 'AbortError') return null;
        throw err;
      }
    }
    let bytes;
    try {
      bytes = await produce(progress);
    } catch (err) {
      if (handle && 'remove' in handle) handle.remove().catch(() => {});
      throw err;
    }
    if (handle) {
      const w = await handle.createWritable();
      await w.write(new Blob([bytes], { type: 'application/pdf' }));
      await w.close();
      return { handle, name: handle.name };
    }
    downloadBytes(bytes, suggestedName);
    return { handle: null, name: suggestedName };
  }

  function afterSave(result) {
    if (!result) return;
    if (result.handle) toast('Saved ' + result.name + '.', 'Open it', () => openHandle(result.handle));
    else toast('Downloaded ' + result.name + '.');
  }

  async function busy(btn, status, fn) {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Working…';
    status.textContent = '';
    status.classList.remove('err');
    try {
      return await fn((msg) => { status.textContent = msg; });
    } catch (err) {
      status.textContent = friendly(err);
      status.classList.add('err');
      return undefined;
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  function parseRanges(text, max) {
    const parts = String(text).split(/[,;]+/).map((s) => s.trim()).filter(Boolean);
    if (!parts.length) return { error: 'Enter page ranges, for example 1-3, 4-8.' };
    const groups = [];
    for (const part of parts) {
      const m = part.match(/^(\d+)\s*(?:[-–]\s*(\d+|end))?$/i);
      if (!m) return { error: '“' + part + '” isn’t a page range. Use numbers like 3 or 4-8.' };
      const a = Number(m[1]);
      const b = m[2] ? (m[2].toLowerCase() === 'end' ? max : Number(m[2])) : a;
      if (a < 1 || b < 1 || a > max || b > max) return { error: '“' + part + '” is outside this PDF, which has ' + plural(max, 'page') + '.' };
      if (b < a) return { error: 'In “' + part + '”, the first page must come before the last.' };
      groups.push(range(a - 1, b - 1));
    }
    return { groups };
  }

  // Re-encodes an image so phone photos come out the right way up (EXIF orientation is applied).
  async function normalizeImage(file) {
    let bitmap;
    try {
      bitmap = await createImageBitmap(file);
    } catch (err) {
      throw new Error('Couldn’t read ' + file.name + '. Use JPG, PNG, WebP, GIF or BMP images.');
    }
    const scale = Math.min(1, 6000 / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale);
    const h = Math.round(bitmap.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const keepPng = file.type === 'image/png' || /\.png$/i.test(file.name) || file.type === 'image/gif';
    const ctx = canvas.getContext('2d');
    if (!keepPng) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(bitmap, 0, 0, w, h);
    bitmap.close();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, keepPng ? 'image/png' : 'image/jpeg', 0.92));
    return { bytes: new Uint8Array(await blob.arrayBuffer()), png: keepPng, width: w, height: h };
  }

  function boxOf(page) {
    const b = page.getCropBox();
    return { x: b.x, y: b.y, w: b.width, h: b.height };
  }

  // ---------- Organize pages ----------
  function organizeTool(preset) {
    let bytes = null;
    let fileName = '';
    let doc = null;
    let pages = [];
    let original = [];
    let observer = null;
    let token = 0;
    const tiles = new Map();

    const status = el('span', { class: 'status', role: 'status' });
    const info = el('p', { class: 'help', role: 'status' });
    const grid = el('div', { class: 'pages', role: 'group', 'aria-label': 'Pages. Click a page to select it; drag to reorder.' });
    const src = sourceField({ preset, onLoad: load });

    const sm = (text, fn, extra) => button('secondary sm', text, fn, extra);
    const rotLeft = el('button', { type: 'button', class: 'icon-btn bordered', title: 'Rotate left (selected pages, or all if none selected)', 'aria-label': 'Rotate left', html: ICONS.rotL, onclick: () => rotate(-90) });
    const rotRight = el('button', { type: 'button', class: 'icon-btn bordered', title: 'Rotate right (selected pages, or all if none selected)', 'aria-label': 'Rotate right', html: ICONS.rotR, onclick: () => rotate(90) });
    const earlier = sm('Move earlier', () => move(-1));
    const later = sm('Move later', () => move(1));
    const del = el('button', { type: 'button', class: 'icon-btn bordered', title: 'Delete selected pages', 'aria-label': 'Delete selected pages', html: ICONS.trash, onclick: removeSelected });
    const bar = el('div', { class: 'org-bar' },
      sm('Select all', () => { pages.forEach((p) => { p.sel = true; }); draw(); }),
      sm('Clear selection', () => { pages.forEach((p) => { p.sel = false; }); draw(); }),
      el('span', { class: 'gap' }), rotLeft, rotRight, earlier, later, del,
      el('span', { class: 'gap' }), sm('Undo all changes', () => { pages = original.map((p) => Object.assign({}, p)); draw(); }));
    const extractBtn = button('secondary', 'Extract selected…', () => saveOut(true));
    const saveBtn = button('primary', 'Save as new PDF…', () => saveOut(false));

    const state = openDialog({
      title: 'Organize pages',
      size: 'wide',
      body: el('div', {}, el('div', { class: 'org-top' }, src.node, info), bar, grid),
      footer: [status, extractBtn, saveBtn]
    });
    state.cleanup = () => {
      token++;
      if (observer) observer.disconnect();
      if (doc) doc.destroy();
    };
    draw();

    async function load(filePromise) {
      const mine = ++token;
      grid.replaceChildren();
      tiles.clear();
      pages = [];
      original = [];
      draw();
      info.textContent = 'Loading pages…';
      try {
        const file = await filePromise;
        const data = new Uint8Array(await file.arrayBuffer());
        const next = await openPdfjsDoc(data);
        if (mine !== token) { next.destroy(); return; }
        if (doc) doc.destroy();
        doc = next;
        bytes = data;
        fileName = file.name;
        original = Array.from({ length: doc.numPages }, (_, i) => ({ n: i, rot: 0, sel: false }));
        pages = original.map((p) => Object.assign({}, p));
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            observer.unobserve(entry.target);
            renderTile(Number(entry.target.dataset.n), mine);
          }
        }, { root: dlg.querySelector('.dlg-body'), rootMargin: '300px' });
        draw();
      } catch (err) {
        if (mine === token) info.textContent = friendly(err);
      }
    }

    function tileFor(n) {
      if (tiles.has(n)) return tiles.get(n);
      const holder = el('span', {});
      const tile = el('button', { type: 'button', class: 'page-tile', 'aria-pressed': 'false', draggable: 'true', dataset: { n: String(n) } },
        el('span', { class: 'page-canvas' }, holder),
        el('span', { class: 'page-label', text: 'Page ' + (n + 1) }));
      tile.addEventListener('click', (e) => {
        const p = pages.find((x) => x.n === n);
        if (!p) return;
        if (e.shiftKey && lastClicked !== null) {
          const a = pages.findIndex((x) => x.n === lastClicked);
          const b = pages.indexOf(p);
          for (const q of pages.slice(Math.min(a, b), Math.max(a, b) + 1)) q.sel = true;
        } else {
          p.sel = !p.sel;
        }
        lastClicked = n;
        draw();
      });
      tile.addEventListener('dragstart', (e) => {
        draggingPage = n;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('application/x-sureshot-page', String(n));
        tile.classList.add('dragging');
      });
      tile.addEventListener('dragend', () => {
        tile.classList.remove('dragging');
        draggingPage = null;
        const order = Array.from(grid.children).map((t) => Number(t.dataset.n));
        pages.sort((a, b) => order.indexOf(a.n) - order.indexOf(b.n));
        draw();
      });
      tiles.set(n, tile);
      if (observer) observer.observe(tile);
      return tile;
    }
    let lastClicked = null;
    let draggingPage = null;
    grid.addEventListener('dragover', (e) => {
      if (draggingPage === null) return;
      e.preventDefault();
      const target = e.target.closest('.page-tile');
      const dragged = tiles.get(draggingPage);
      if (!target || target === dragged) return;
      const r = target.getBoundingClientRect();
      const after = e.clientX > r.left + r.width / 2;
      grid.insertBefore(dragged, after ? target.nextSibling : target);
    });
    grid.addEventListener('drop', (e) => { if (draggingPage !== null) e.preventDefault(); });

    async function renderTile(n, mine) {
      if (!doc || mine !== token) return;
      try {
        const page = await doc.getPage(n + 1);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: Math.min(216 / base.width, 280 / base.height) });
        const canvas = el('canvas', {});
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        canvas.style.width = Math.round(viewport.width / 2) + 'px';
        canvas.style.height = Math.round(viewport.height / 2) + 'px';
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        if (mine !== token) return;
        const tile = tiles.get(n);
        if (tile) tile.querySelector('.page-canvas > span').replaceChildren(canvas);
      } catch (err) { /* leave the tile blank */ }
    }

    function draw() {
      const ordered = pages.map((p) => tileFor(p.n));
      grid.replaceChildren(...ordered);
      for (const p of pages) {
        const tile = tiles.get(p.n);
        tile.setAttribute('aria-pressed', String(p.sel));
        tile.setAttribute('aria-label', 'Page ' + (p.n + 1) + (p.rot ? ', rotated ' + ((p.rot % 360) + 360) % 360 + ' degrees' : '') + (p.sel ? ', selected' : ''));
        const holder = tile.querySelector('.page-canvas > span');
        const turn = ((p.rot % 360) + 360) % 360;
        holder.style.transform = 'rotate(' + p.rot + 'deg)' + (turn === 90 || turn === 270 ? ' scale(0.78)' : '');
      }
      const selected = pages.filter((p) => p.sel).length;
      const loaded = pages.length > 0;
      if (loaded) info.textContent = plural(pages.length, 'page') + (selected ? ', ' + selected + ' selected' : '') + '. Click pages to select them, then drag or use the buttons.';
      for (const b of [earlier, later, del]) b.disabled = !selected;
      rotLeft.disabled = rotRight.disabled = !loaded;
      extractBtn.disabled = !selected;
      saveBtn.disabled = !loaded;
    }

    function rotate(deg) {
      const target = pages.some((p) => p.sel) ? pages.filter((p) => p.sel) : pages;
      for (const p of target) p.rot += deg;
      draw();
    }
    function move(dir) {
      if (dir < 0) {
        for (let i = 1; i < pages.length; i++) {
          if (pages[i].sel && !pages[i - 1].sel) [pages[i - 1], pages[i]] = [pages[i], pages[i - 1]];
        }
      } else {
        for (let i = pages.length - 2; i >= 0; i--) {
          if (pages[i].sel && !pages[i + 1].sel) [pages[i + 1], pages[i]] = [pages[i], pages[i + 1]];
        }
      }
      draw();
    }
    function removeSelected() {
      if (pages.every((p) => p.sel)) { status.textContent = 'A PDF needs at least one page. To delete every page, delete the file instead.'; return; }
      pages = pages.filter((p) => !p.sel);
      draw();
    }

    function saveOut(onlySelected) {
      const list = onlySelected ? pages.filter((p) => p.sel) : pages.slice();
      if (!list.length || !bytes) return;
      const btn = onlySelected ? extractBtn : saveBtn;
      const suffix = onlySelected ? ' (extract).pdf' : ' (organized).pdf';
      busy(btn, status, (progress) => saveWith(baseName(fileName) + suffix, async () => {
        progress('Building the PDF…');
        const { PDFDocument, degrees } = await getPdfLib();
        const source = await PDFDocument.load(bytes, { updateMetadata: false }).catch(() => { throw new Error(fileName + ' is password-protected or damaged, so its pages can’t be changed.'); });
        const out = await PDFDocument.create();
        const copied = await out.copyPages(source, list.map((p) => p.n));
        copied.forEach((page, i) => {
          const extra = list[i].rot;
          if (extra) page.setRotation(degrees((((page.getRotation().angle + extra) % 360) + 360) % 360));
          out.addPage(page);
        });
        return out.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ---------- Merge ----------
  function mergeTool() {
    const list = [];
    const status = el('span', { class: 'status', role: 'status' });
    const ul = el('ul', { class: 'file-list' });
    const src = sourceField({ label: 'Add a PDF from your tabs or Recent' });
    const saveBtn = button('primary', 'Merge and save…', save);

    function draw() {
      ul.replaceChildren(...list.map((entry, i) => el('li', { class: 'file-row' },
        el('span', { class: 'name', text: (i + 1) + '. ' + entry.name }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Move up', 'aria-label': 'Move ' + entry.name + ' up', html: ICONS.up, disabled: i === 0 ? true : null, onclick: () => { [list[i - 1], list[i]] = [list[i], list[i - 1]]; draw(); } }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Move down', 'aria-label': 'Move ' + entry.name + ' down', html: ICONS.down, disabled: i === list.length - 1 ? true : null, onclick: () => { [list[i + 1], list[i]] = [list[i], list[i + 1]]; draw(); } }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Remove', 'aria-label': 'Remove ' + entry.name, html: ICONS.x, onclick: () => { list.splice(i, 1); draw(); } }))));
      if (!list.length) ul.replaceChildren(el('li', { class: 'empty-line', text: 'No PDFs added yet. Add at least two.' }));
      saveBtn.disabled = list.length < 2;
    }
    const add = (name, filePromise) => { filePromise.catch(() => {}); list.push({ name, file: filePromise }); draw(); };

    openDialog({
      title: 'Merge PDFs',
      body: el('div', {},
        el('div', { class: 'inline', style: 'align-items: flex-end' }, el('div', { style: 'flex: 1; min-width: 240px' }, src.node),
          el('div', { class: 'form-row' }, button('secondary', 'Add', () => { if (src.select.value) add(src.name(), src.get()); }))),
        el('div', { class: 'inline', style: 'margin-bottom: 14px' },
          button('secondary sm', 'Add PDFs from your PC…', async () => { for (const p of await pickPdfs(true)) add(p.file.name, Promise.resolve(p.file)); }),
          button('secondary sm', 'Add all open tabs', () => { for (const t of tabs) add(t.name, Promise.resolve(t.file)); }, { disabled: tabs.length ? null : true })),
        el('h3', { class: 'field-label', style: 'margin: 0 0 8px', text: 'Order in the merged PDF' }),
        ul),
      footer: [status, saveBtn]
    });
    draw();

    function save() {
      const name = baseName(list[0].name) + ' (merged).pdf';
      busy(saveBtn, status, (progress) => saveWith(name, async () => {
        const { PDFDocument } = await getPdfLib();
        const out = await PDFDocument.create();
        for (let i = 0; i < list.length; i++) {
          progress('Adding ' + (i + 1) + ' of ' + list.length + '…');
          const file = await list[i].file;
          const source = await loadForEditing(file);
          const copied = await out.copyPages(source, source.getPageIndices());
          copied.forEach((p) => out.addPage(p));
        }
        progress('Saving…');
        return out.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ---------- Split ----------
  function splitTool(preset) {
    let source = null;
    let fileName = '';
    const status = el('span', { class: 'status', role: 'status' });
    const info = el('p', { class: 'help', role: 'status' });
    const src = sourceField({ preset, onLoad: async (p) => {
      source = null;
      info.textContent = 'Reading…';
      try {
        const file = await p;
        source = await loadForEditing(file);
        fileName = file.name;
        update();
      } catch (err) {
        info.textContent = friendly(err);
        update();
      }
    } });
    const mode = selectField([['each', 'Every page as its own PDF'], ['every', 'Every few pages'], ['ranges', 'Page ranges I choose']], 'ranges');
    const every = numberField(2, 1);
    const ranges = el('input', { type: 'text', class: 'field', placeholder: 'For example 1-3, 4-10, 11-end' });
    const everyRow = formRow('Pages in each PDF', every);
    const rangesRow = formRow('Page ranges', ranges, 'Each range becomes its own PDF. Use “end” for the last page.');
    const runBtn = button('primary', 'Choose a folder and split…', run);

    function groups() {
      const max = source ? source.getPageCount() : 0;
      if (!max) return { error: 'Choose a PDF first.' };
      if (mode.value === 'each') return { groups: range(0, max - 1).map((i) => [i]) };
      if (mode.value === 'every') {
        const n = Number(every.value);
        if (!Number.isInteger(n) || n < 1) return { error: 'Enter how many pages go in each PDF.' };
        const out = [];
        for (let i = 0; i < max; i += n) out.push(range(i, Math.min(max, i + n) - 1));
        return { groups: out };
      }
      return parseRanges(ranges.value, max);
    }
    function update() {
      everyRow.hidden = mode.value !== 'every';
      rangesRow.hidden = mode.value !== 'ranges';
      if (!source) { runBtn.disabled = true; return; }
      const g = groups();
      if (g.error) {
        info.textContent = plural(source.getPageCount(), 'page') + '. ' + (mode.value === 'ranges' && !ranges.value.trim() ? 'Enter the ranges to split into.' : g.error);
        runBtn.disabled = true;
      } else {
        info.textContent = plural(source.getPageCount(), 'page') + '. This creates ' + plural(g.groups.length, 'PDF') + '.';
        runBtn.disabled = false;
      }
    }
    mode.addEventListener('change', update);
    every.addEventListener('input', update);
    ranges.addEventListener('input', update);

    openDialog({
      title: 'Split a PDF',
      body: el('div', {}, src.node, info, el('div', { style: 'height: 10px' }), formRow('How to split', mode), everyRow, rangesRow,
        el('p', { class: 'help', text: 'You choose a folder, and the new PDFs are saved there. Existing files are never overwritten.' })),
      footer: [status, runBtn]
    });
    update();

    async function uniqueName(dir, name) {
      let candidate = name;
      for (let i = 2; i < 1000; i++) {
        try {
          await dir.getFileHandle(candidate);
          candidate = baseName(name) + ' (' + i + ').pdf';
        } catch (err) {
          if (err.name === 'NotFoundError' || err.name === 'TypeMismatchError') return candidate;
          throw err;
        }
      }
      return candidate;
    }

    function run() {
      const g = groups();
      if (g.error) { status.textContent = g.error; status.classList.add('err'); return; }
      busy(runBtn, status, async (progress) => {
        let dir = null;
        if ('showDirectoryPicker' in window) {
          try {
            dir = await window.showDirectoryPicker({ mode: 'readwrite' });
          } catch (err) {
            if (err.name === 'AbortError') return null;
            throw err;
          }
        }
        const { PDFDocument } = await getPdfLib();
        const base = baseName(fileName);
        for (let i = 0; i < g.groups.length; i++) {
          progress('Creating ' + (i + 1) + ' of ' + g.groups.length + '…');
          const pagesIn = g.groups[i];
          const out = await PDFDocument.create();
          const copied = await out.copyPages(source, pagesIn);
          copied.forEach((p) => out.addPage(p));
          const bytes = await out.save();
          const label = pagesIn.length === 1 ? 'page ' + (pagesIn[0] + 1) : 'pages ' + (pagesIn[0] + 1) + '-' + (pagesIn[pagesIn.length - 1] + 1);
          const name = base + ' (' + label + ').pdf';
          if (dir) {
            const handle = await dir.getFileHandle(await uniqueName(dir, name), { create: true });
            const w = await handle.createWritable();
            await w.write(new Blob([bytes], { type: 'application/pdf' }));
            await w.close();
          } else {
            downloadBytes(bytes, name);
          }
        }
        return { count: g.groups.length, dir };
      }).then((res) => {
        if (!res) return;
        status.textContent = '';
        toast('Created ' + plural(res.count, 'PDF') + (res.dir ? ' in “' + res.dir.name + '”.' : '.'));
      });
    }
  }

  // ---------- Images to PDF ----------
  function imagesTool() {
    const list = [];
    const status = el('span', { class: 'status', role: 'status' });
    const ul = el('ul', { class: 'file-list' });
    const size = selectField([['fit', 'Same size as each image'], ['a4', 'A4, image fitted to the page'], ['letter', 'US Letter, image fitted to the page']], 'a4');
    const margin = selectField([['0', 'None'], ['18', 'Small'], ['36', 'Medium']], '18');
    const saveBtn = button('primary', 'Save as PDF…', save);

    function draw() {
      ul.replaceChildren(...list.map((entry, i) => el('li', { class: 'file-row' },
        el('img', { src: entry.url, alt: '' }),
        el('span', { class: 'name', text: (i + 1) + '. ' + entry.file.name }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Move up', 'aria-label': 'Move ' + entry.file.name + ' up', html: ICONS.up, disabled: i === 0 ? true : null, onclick: () => { [list[i - 1], list[i]] = [list[i], list[i - 1]]; draw(); } }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Move down', 'aria-label': 'Move ' + entry.file.name + ' down', html: ICONS.down, disabled: i === list.length - 1 ? true : null, onclick: () => { [list[i + 1], list[i]] = [list[i], list[i + 1]]; draw(); } }),
        el('button', { type: 'button', class: 'icon-btn', title: 'Remove', 'aria-label': 'Remove ' + entry.file.name, html: ICONS.x, onclick: () => { URL.revokeObjectURL(entry.url); list.splice(i, 1); draw(); } }))));
      if (!list.length) ul.replaceChildren(el('li', { class: 'empty-line', text: 'No images added yet.' }));
      saveBtn.disabled = !list.length;
    }

    const state = openDialog({
      title: 'Images to PDF',
      body: el('div', {},
        el('div', { class: 'inline', style: 'margin-bottom: 14px' }, button('secondary', 'Add images…', async () => {
          for (const file of await pickImages(true)) list.push({ file, url: URL.createObjectURL(file) });
          draw();
        })),
        ul,
        el('div', { class: 'form-grid' }, formRow('Page size', size), formRow('Margin', margin)),
        el('p', { class: 'help', text: 'Each image gets its own page, turned to portrait or landscape to suit it. Phone photos are rotated the right way up.' })),
      footer: [status, saveBtn]
    });
    state.cleanup = () => list.forEach((e) => URL.revokeObjectURL(e.url));
    draw();

    function save() {
      busy(saveBtn, status, (progress) => saveWith('Images.pdf', async () => {
        const { PDFDocument } = await getPdfLib();
        const out = await PDFDocument.create();
        const m = Number(margin.value);
        for (let i = 0; i < list.length; i++) {
          progress('Adding image ' + (i + 1) + ' of ' + list.length + '…');
          const img = await normalizeImage(list[i].file);
          const embedded = img.png ? await out.embedPng(img.bytes) : await out.embedJpg(img.bytes);
          const iw = img.width * 0.75;
          const ih = img.height * 0.75;
          let pw;
          let ph;
          if (size.value === 'fit') {
            pw = iw + m * 2;
            ph = ih + m * 2;
          } else {
            const [a, b] = size.value === 'a4' ? [595.28, 841.89] : [612, 792];
            [pw, ph] = iw > ih ? [b, a] : [a, b];
          }
          const s = Math.min((pw - m * 2) / iw, (ph - m * 2) / ih, size.value === 'fit' ? 1 : Infinity);
          const w = iw * s;
          const h = ih * s;
          const page = out.addPage([pw, ph]);
          page.drawImage(embedded, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });
        }
        progress('Saving…');
        return out.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ---------- Page numbers ----------
  function numbersTool(preset) {
    const status = el('span', { class: 'status', role: 'status' });
    const src = sourceField({ preset });
    const position = selectField([['bc', 'Bottom centre'], ['br', 'Bottom right'], ['bl', 'Bottom left'], ['tc', 'Top centre'], ['tr', 'Top right']], 'bc');
    const format = selectField([['n', '1, 2, 3'], ['page', 'Page 1, Page 2'], ['pageof', 'Page 1 of 12']], 'pageof');
    const start = numberField(1, 0);
    const fontSize = selectField([['9', '9 point'], ['10', '10 point'], ['11', '11 point'], ['12', '12 point']], '10');
    const skipFirst = el('input', { type: 'checkbox', id: uid('f') });
    const saveBtn = button('primary', 'Save as new PDF…', save);

    openDialog({
      title: 'Add page numbers',
      body: el('div', {}, src.node,
        el('div', { class: 'form-grid' }, formRow('Position', position), formRow('Style', format), formRow('Start at', start), formRow('Text size', fontSize)),
        el('label', { class: 'choice', for: skipFirst.id }, skipFirst, 'Don’t number the first page (a cover, for example)')),
      footer: [status, saveBtn]
    });

    function save() {
      const first = Number(start.value);
      if (!Number.isInteger(first) || first < 0) { status.textContent = 'Enter the number to start from.'; status.classList.add('err'); return; }
      busy(saveBtn, status, (progress) => saveWith(baseName(src.name()) + ' (numbered).pdf', async () => {
        const file = await src.get();
        const { StandardFonts, rgb } = await getPdfLib();
        const doc = await loadForEditing(file);
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const size = Number(fontSize.value);
        const pagesAll = doc.getPages();
        const skip = skipFirst.checked ? 1 : 0;
        const last = first + pagesAll.length - skip - 1;
        pagesAll.forEach((page, i) => {
          if (i < skip) return;
          const n = first + i - skip;
          const text = format.value === 'n' ? String(n) : format.value === 'page' ? 'Page ' + n : 'Page ' + n + ' of ' + last;
          const box = boxOf(page);
          const w = font.widthOfTextAtSize(text, size);
          const margin = 28;
          const pos = position.value;
          const x = pos[1] === 'c' ? box.x + (box.w - w) / 2 : pos[1] === 'r' ? box.x + box.w - margin - w : box.x + margin;
          const y = pos[0] === 'b' ? box.y + margin : box.y + box.h - margin - size;
          page.drawText(text, { x, y, size, font, color: rgb(0.2, 0.2, 0.2) });
        });
        progress('Saving…');
        return doc.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ---------- Watermark ----------
  function watermarkTool(preset) {
    const status = el('span', { class: 'status', role: 'status' });
    const src = sourceField({ preset });
    const text = el('input', { type: 'text', class: 'field', value: 'DRAFT' });
    const strength = selectField([['0.12', 'Light'], ['0.2', 'Medium'], ['0.32', 'Strong']], '0.2');
    const colour = selectField([['grey', 'Grey'], ['red', 'Red'], ['blue', 'Blue']], 'grey');
    const angle = selectField([['diag', 'Diagonal'], ['flat', 'Horizontal']], 'diag');
    const saveBtn = button('primary', 'Save as new PDF…', save);

    openDialog({
      title: 'Add a watermark',
      body: el('div', {}, src.node, formRow('Text', text),
        el('div', { class: 'form-grid' }, formRow('Strength', strength), formRow('Colour', colour), formRow('Direction', angle))),
      footer: [status, saveBtn]
    });

    function save() {
      const words = text.value.trim();
      if (!words) { status.textContent = 'Enter the watermark text.'; status.classList.add('err'); return; }
      busy(saveBtn, status, (progress) => saveWith(baseName(src.name()) + ' (watermarked).pdf', async () => {
        const file = await src.get();
        const { StandardFonts, rgb, degrees } = await getPdfLib();
        const doc = await loadForEditing(file);
        let font;
        try {
          font = await doc.embedFont(StandardFonts.HelveticaBold);
          font.widthOfTextAtSize(words, 10);
        } catch (err) {
          throw new Error('The watermark text can only use standard Latin letters, numbers and punctuation.');
        }
        const color = { grey: rgb(0.45, 0.45, 0.45), red: rgb(0.78, 0.06, 0.18), blue: rgb(0.1, 0.3, 0.75) }[colour.value];
        for (const page of doc.getPages()) {
          const box = boxOf(page);
          const theta = angle.value === 'diag' ? Math.atan2(box.h, box.w) : 0;
          const span = angle.value === 'diag' ? Math.hypot(box.w, box.h) * 0.62 : box.w * 0.72;
          const size = clamp(span / font.widthOfTextAtSize(words, 1), 18, 160);
          const w = font.widthOfTextAtSize(words, size);
          const cx = box.x + box.w / 2;
          const cy = box.y + box.h / 2;
          const x = cx - (w / 2) * Math.cos(theta) + size * 0.35 * Math.sin(theta);
          const y = cy - (w / 2) * Math.sin(theta) - size * 0.35 * Math.cos(theta);
          page.drawText(words, { x, y, size, font, color, opacity: Number(strength.value), rotate: degrees((theta * 180) / Math.PI) });
        }
        progress('Saving…');
        return doc.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ---------- Stamp an image ----------
  function stampTool(preset) {
    let image = null;
    let previewUrl = null;
    const status = el('span', { class: 'status', role: 'status' });
    const src = sourceField({ preset });
    const preview = el('img', { alt: '', style: 'max-width: 160px; max-height: 70px; display: none; background: #fff; border: 1px solid var(--line); border-radius: 4px' });
    const imgName = el('span', { class: 'muted', text: 'No image chosen' });
    const which = selectField([['last', 'Last page'], ['first', 'First page'], ['all', 'Every page'], ['custom', 'Pages I choose']], 'last');
    const custom = el('input', { type: 'text', class: 'field', placeholder: 'For example 2, 5-7' });
    const customRow = formRow('Pages', custom);
    const position = selectField([['br', 'Bottom right'], ['bl', 'Bottom left'], ['bc', 'Bottom centre'], ['tr', 'Top right'], ['tl', 'Top left'], ['c', 'Centre']], 'br');
    const width = numberField(45, 5, 400);
    const margin = numberField(15, 0, 100);
    const saveBtn = button('primary', 'Save as new PDF…', save);
    const sync = () => { customRow.hidden = which.value !== 'custom'; };
    which.addEventListener('change', sync);

    const state = openDialog({
      title: 'Stamp an image',
      body: el('div', {}, src.node,
        el('div', { class: 'form-row' }, el('span', { class: 'field-label', text: 'Image' }),
          el('div', { class: 'inline' }, button('secondary sm', 'Choose image…', async () => {
            const files = await pickImages(false);
            if (!files.length) return;
            image = files[0];
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(image);
            preview.src = previewUrl;
            preview.style.display = 'block';
            imgName.textContent = image.name;
          }), imgName), preview,
          el('p', { class: 'help', text: 'A PNG with a transparent background looks best for signatures. This places a picture; it isn’t a certified digital signature.' })),
        el('div', { class: 'form-grid' }, formRow('Put it on', which), customRow, formRow('Position', position), formRow('Width (mm)', width), formRow('Distance from edge (mm)', margin))),
      footer: [status, saveBtn]
    });
    state.cleanup = () => { if (previewUrl) URL.revokeObjectURL(previewUrl); };
    sync();

    function save() {
      if (!image) { status.textContent = 'Choose the image to stamp.'; status.classList.add('err'); return; }
      const wmm = Number(width.value);
      const mmm = Number(margin.value);
      if (!(wmm > 0) || !(mmm >= 0)) { status.textContent = 'Check the width and distance from the edge.'; status.classList.add('err'); return; }
      busy(saveBtn, status, (progress) => saveWith(baseName(src.name()) + ' (stamped).pdf', async () => {
        const file = await src.get();
        const doc = await loadForEditing(file);
        const count = doc.getPageCount();
        let targets;
        if (which.value === 'last') targets = [count - 1];
        else if (which.value === 'first') targets = [0];
        else if (which.value === 'all') targets = range(0, count - 1);
        else {
          const parsed = parseRanges(custom.value, count);
          if (parsed.error) throw new Error(parsed.error);
          targets = Array.from(new Set(parsed.groups.flat()));
        }
        const img = await normalizeImage(image);
        const embedded = img.png ? await doc.embedPng(img.bytes) : await doc.embedJpg(img.bytes);
        const w = wmm * MM;
        const h = (w * img.height) / img.width;
        const m = mmm * MM;
        const pagesAll = doc.getPages();
        for (const i of targets) {
          const page = pagesAll[i];
          const box = boxOf(page);
          const pos = position.value;
          const x = pos === 'c' || pos === 'bc' ? box.x + (box.w - w) / 2 : pos.endsWith('r') ? box.x + box.w - m - w : box.x + m;
          const y = pos === 'c' ? box.y + (box.h - h) / 2 : pos.startsWith('t') ? box.y + box.h - m - h : box.y + m;
          page.drawImage(embedded, { x, y, width: w, height: h });
        }
        progress('Saving…');
        return doc.save();
      }, progress)).then((res) => { if (res) { status.textContent = ''; afterSave(res); } });
    }
  }

  // ============================================================
  // Keyboard, safety and start-up
  // ============================================================
  document.addEventListener('keydown', (e) => {
    if (dlg.open || promptDlg.open || !menuEl.hidden) return;
    const ctrl = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (ctrl && !e.shiftKey && !e.altKey && key === 'o') { e.preventDefault(); chooseAndOpen(); return; }
    if (ctrl && e.key === 'PageDown') { e.preventDefault(); cycleTabs(1); return; }
    if (ctrl && e.key === 'PageUp') { e.preventDefault(); cycleTabs(-1); return; }
    if (e.altKey && !ctrl && e.key === 'Home') { e.preventDefault(); activate(HOME); return; }
    if (ctrl && !e.shiftKey && !e.altKey && /^[1-9]$/.test(e.key) && tabs.length) {
      e.preventDefault();
      const t = e.key === '9' ? tabs[tabs.length - 1] : tabs[Number(e.key) - 1];
      if (t) activate(t.id);
      return;
    }
    if (ctrl && !e.shiftKey && key === 'f' && activeId === HOME) { e.preventDefault(); searchEl.focus(); searchEl.select(); }
  });

  // Closing the window (including Ctrl+W) would lose open PDFs and any unsaved annotations.
  window.addEventListener('beforeunload', (e) => {
    if (!tabs.length) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // Ask Edge not to clear this app's storage under disk pressure.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then((granted) => (granted ? null : navigator.storage.persist())).catch(() => {});
  }

  const installed = window.matchMedia('(display-mode: standalone), (display-mode: window-controls-overlay)').matches;
  $('#hint').textContent = installed
    ? 'Open PDFs from File Explorer with right-click, Open with, Sureshot PDF. Your library is stored only on this PC.'
    : 'Install Sureshot PDF from the app icon in Edge’s address bar to open PDFs straight from File Explorer.';

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  activate(HOME);

  (async () => {
    const [storedRecords, storedHandles, storedCollections, textKeys] = await Promise.all([
      dbGet('session', 'recents').catch(() => null),
      dbGet('session', 'handles').catch(() => null),
      dbGet('session', 'collections').catch(() => null),
      dbKeys('text').catch(() => [])
    ]);
    records = (Array.isArray(storedRecords) ? storedRecords : [])
      .filter((r) => r && r.id && r.handle)
      .map((r) => Object.assign({ pinned: false, favourite: false, note: '', bookmarks: [], lastOpened: null }, r));
    collections = (Array.isArray(storedCollections) ? storedCollections : []).filter((c) => c && c.id && c.name);
    for (const c of collections) {
      if (c.kind === 'manual') c.fileIds = (c.fileIds || []).filter((id) => records.some((r) => r.id === id));
    }
    for (const k of textKeys || []) indexedSigs.add(k);
    trimRecords();
    savedSession = Array.isArray(storedHandles) ? storedHandles : [];
    resolveReady();
    renderHomeSoon();
    for (const c of collections) if (c.kind === 'folder') scanFolder(c, { request: false });
  })().catch(() => resolveReady());
})();
</script>
